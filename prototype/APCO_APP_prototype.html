<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APCO Mantenance app</title>
<style>

/* ---- 1. BRAND -------------------------------------------- */
:root{
  --brand-navy:#10293B;
  --brand-navy-deep:#0A1721;
  --brand-blue:#2F80B4;
  --brand-blue-bright:#3E93C9;
  --brand-blue-deep:#14405F;
  --brand-grey-1:#EDF0F1;
  --brand-grey-2:#B9C1C6;
  --brand-grey-3:#6C7880;
}

:root,
:root[data-theme="light"]{
  --paper:#D7E6EC;
  --sheet:#F1F8FA;
  --panel:#FFFFFF;
  --fill:#E4F2F7;
  --fill2:#C9E4EE;

  --ink:#10293B;
  --ink2:#455E6C;
  --ink3:#5A7080;
  --ink-inv:#FFFFFF;

  --line:#B7D3DE;
  --line2:#5E8B9C;

  --accent:#0B5E92;
  --accent-graphic:#1E8ACD;
  --accent-soft:#D8ECF8;
  --on-accent:#FFFFFF;

  --st-pending:#0C6B72;      --st-pending-soft:#E2F4F6;
  --st-accepted:#0B5E92;     --st-accepted-soft:#D8ECF8;
  --st-progress:#0B5E92;     --st-progress-soft:#D8ECF8;
  --st-closed:#12684A;       --st-closed-soft:#D3EFE0;
  --st-cancelled:#5B6870;    --st-cancelled-soft:#E6EAEC;

  --alert:#B32B20;           --alert-soft:#FCDFDA;
  --warn:#8A5800;            --warn-soft:#FDEECB;
  --ok:#12684A;              --ok-soft:#D3EFE0;

  --accent-hover:#084B76;
  --shadow-1:0 1px 2px rgba(11,58,84,.07),0 1px 3px rgba(11,58,84,.09);
  --shadow-2:0 2px 6px rgba(11,58,84,.07),0 8px 20px rgba(11,58,84,.12);
  --shadow-accent:0 2px 10px rgba(11,94,146,.32);
  --shadow-overlay:0 -2px 24px rgba(16,41,59,.16);
  --shadow-dialog:0 8px 32px rgba(16,41,59,.22);
  --scrim:rgba(16,41,59,.44);
  --grid-line:rgba(11,58,84,.06);
}

:root[data-theme="dark"]{
  --paper:#061520;
  --sheet:#0E2635;
  --panel:#173B52;
  --fill:#1E4A63;
  --fill2:#215068;

  --ink:#E9EFF2;
  --ink2:#BCCDD6;
  --ink3:#A6BAC5;
  --ink-inv:#0A1721;

  --line:#2B5470;
  --line2:#5E8FA9;

  --accent:#6FBCEC;
  --accent-graphic:#6FBCEC;
  --accent-soft:#123A52;
  --on-accent:#0A1721;

  --st-pending:#7FD0D4;      --st-pending-soft:#0F3236;
  --st-accepted:#6FBCEC;     --st-accepted-soft:#123A52;
  --st-progress:#6FBCEC;     --st-progress-soft:#123A52;
  --st-closed:#71D3A4;       --st-closed-soft:#0E3527;
  --st-cancelled:#9BA5AD;    --st-cancelled-soft:#1E2A33;

  --alert:#F79A8A;           --alert-soft:#42201A;
  --warn:#EDBB5E;            --warn-soft:#3B2C0E;
  --ok:#71D3A4;              --ok-soft:#0E3527;

  --accent-hover:#8ACCF3;
  --shadow-1:0 1px 2px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.24);
  --shadow-2:0 2px 6px rgba(0,0,0,.30),0 8px 20px rgba(0,0,0,.36);
  --shadow-accent:0 2px 10px rgba(0,0,0,.40);
  --shadow-overlay:0 -2px 24px rgba(0,0,0,.5);
  --shadow-dialog:0 8px 32px rgba(0,0,0,.6);
  --scrim:rgba(4,10,15,.62);
  --grid-line:rgba(233,239,242,.05);
}

/* ---- 4. TYPE --------------------------------------------- */
:root{
  --sans:system-ui,"Segoe UI",Roboto,"Noto Sans Arabic","Dubai",Tahoma,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,Menlo,"Liberation Mono",monospace;

  --fs-display:26px;  --lh-display:1.22;
  --fs-h1:20px;       --lh-h1:1.3;
  --fs-h2:17px;       --lh-h2:1.35;
  --fs-h3:15.5px;     --lh-h3:1.4;
  --fs-body:15px;     --lh-body:1.5;
  --fs-sm:13.5px;     --lh-sm:1.45;
  --fs-label:12px;    --lh-label:1.4;
  --fs-micro:11px;    --lh-micro:1.35;

  --fs-value-xl:26px;
  --fs-value-lg:19px;
  --fs-value:14.5px;

  --tracking-label:.05em;
}

/* ---- 5. SPACE / SHAPE / MOTION --------------------------- */
:root{
  --s-1:4px;  --s-2:8px;  --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-7:32px; --s-8:40px; --s-9:48px; --s-10:64px;

  --r-0:0px; --r-1:6px; --r-2:10px; --r-3:14px; --r-pill:999px;

  --bw-hair:1px; --bw-ctrl:1px; --bw-emph:2px; --bw-status:4px;

  --touch-min:48px;
  --touch-comfort:52px;
  --touch-primary:56px;

  --dur-micro:120ms; --dur-in:180ms; --dur-sheet:240ms;
  --ease:cubic-bezier(.2,.7,.3,1); --ease-out:cubic-bezier(.16,1,.3,1);

  --ctrl-xs:30px;
  --ctrl-sm:38px;
  --ctrl-md:44px;
  --ctrl-lg:48px;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}

*{box-sizing:border-box;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tech{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}

/* ---- status chip (2.11) ---------------------------------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--sans);font-size:var(--fs-label);font-weight:600;line-height:1.7;
  padding:0 9px;border:var(--bw-ctrl) solid currentColor;border-radius:var(--r-pill);
  white-space:nowrap;
}
.chip::before{content:"";width:6px;height:6px;border:1.5px solid currentColor;flex:none;}
.chip.c-pending{color:var(--st-pending);}
.chip.c-accepted{color:var(--st-accepted);}
.chip.c-progress{color:var(--st-progress);background:var(--st-progress-soft);}
.chip.c-progress::before{background:currentColor;}
.chip.c-closed{color:var(--st-closed);background:var(--st-closed-soft);}
.chip.c-closed::before{background:currentColor;border-radius:var(--r-pill);}
.chip.c-cancelled{color:var(--st-cancelled);border-style:dashed;}
.chip.c-overdue{color:var(--alert);background:var(--alert-soft);}
.chip.c-upcoming{color:var(--warn);background:var(--warn-soft);}

/* ---- 2.9 buttons ---------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  position:relative;min-height:var(--ctrl-lg);min-width:var(--ctrl-lg);padding:0 var(--s-4);
  font-family:var(--sans);font-size:var(--fs-h3);font-weight:600;
  border:var(--bw-ctrl) solid transparent;border-radius:var(--r-1);
  background:var(--fill);color:var(--ink);cursor:pointer;
  transition:background var(--dur-micro) var(--ease),
             border-color var(--dur-micro) var(--ease),
             box-shadow var(--dur-micro) var(--ease),
             transform var(--dur-micro) var(--ease);}
.btn:active{transform:translateY(1px);}
.btn-primary{min-height:var(--touch-primary);width:100%;
  background:var(--accent);color:var(--on-accent);border-color:var(--accent);
  box-shadow:var(--shadow-accent);}
.btn-primary:active{box-shadow:none;}
.btn-secondary{background:var(--panel);border-color:var(--line2);color:var(--ink);
  min-height:var(--ctrl-lg);box-shadow:var(--shadow-1);}
.btn-destructive{background:var(--panel);border-color:var(--alert);color:var(--alert);min-height:var(--ctrl-lg);}
.btn-sm{min-height:var(--ctrl-sm);min-width:0;width:auto;
  padding:0 var(--s-4);font-size:var(--fs-sm);box-shadow:none;}
.btn-sm::after{content:"";position:absolute;inset-inline:0;inset-block:-5px;}
.btn-blocked{background:var(--fill2);color:var(--ink2);border-color:var(--line);cursor:not-allowed;}
.blocked{display:flex;flex-direction:column;gap:var(--s-2);}
.blocked-why{display:flex;gap:var(--s-2);align-items:flex-start;font-size:var(--fs-sm);color:var(--alert);}
.blocked-why svg{flex:none;margin-block-start:1px;}
.blocked>.field-h{text-align:center;}

/* ---- 2.10 form field ------------------------------------ */
.field{display:block;}
.field-l{display:block;font-size:var(--fs-label);font-weight:600;letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink2);margin-bottom:var(--s-2);}
.field-c{display:flex;align-items:center;gap:var(--s-2);width:100%;min-height:var(--ctrl-lg);
  padding:0 var(--s-3);background:var(--panel);border:var(--bw-ctrl) solid var(--line);
  border-radius:var(--r-1);font-size:var(--fs-body);color:var(--ink);
  font-family:inherit;text-align:start;}
.field-c .ph{color:var(--ink3);}
.field-c .grow{flex:1;min-width:0;}
.field-c.ro{border-style:dashed;background:var(--fill);color:var(--ink2);}
.field-c.err{border-color:var(--alert);border-width:var(--bw-emph);}
.field-c.foc{border-color:var(--accent);border-width:var(--bw-emph);box-shadow:0 0 0 3px var(--accent-soft);}
.field-c.dis{background:var(--fill2);color:var(--ink2);border-color:var(--line);}
.field-c.dis .ph{color:var(--ink2);}
.field-c.area{min-height:var(--touch-primary);align-items:flex-start;padding-block:var(--s-3);}
.field-c .cell{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s-2);
  min-height:var(--ctrl-lg);padding:0;border:0;background:none;cursor:pointer;
  font-family:inherit;font-size:var(--fs-body);color:inherit;text-align:start;}
.field-c .ok{display:flex;color:var(--ok);}
.field-h{font-size:var(--fs-sm);color:var(--ink2);margin-top:var(--s-1);}
.field-h.e{color:var(--alert);}

/* ---- 2.1 / 2.2 navigation -------------------------------- */
.appbar{display:flex;align-items:center;gap:var(--s-2);min-height:var(--ctrl-lg);
  padding:var(--s-2) var(--s-2);color:#fff;border-block-end:0;position:relative;z-index:5;
  background:linear-gradient(180deg,var(--brand-navy) 0%,var(--brand-navy-deep) 100%);
  box-shadow:var(--shadow-1);}
.appbar b{font-size:var(--fs-h3);font-weight:600;flex:1;min-width:0;padding-inline:var(--s-2);}
.appbar .ab-btn{background:none;border:0;color:inherit;min-width:var(--touch-min);
  min-height:var(--touch-min);cursor:pointer;display:grid;place-items:center;}
.appbar .sub{display:block;font-size:var(--fs-micro);font-weight:400;color:#A8BCC8;}
.tabbar{display:flex;background:var(--panel);border-block-start:var(--bw-ctrl) solid var(--line2);}
.tabbar button{flex:1;min-height:var(--touch-comfort);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;border:0;background:none;cursor:pointer;
  color:var(--ink3);font-family:inherit;font-size:var(--fs-micro);padding:var(--s-2) var(--s-1);}
.tabbar button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent);}
.tabbar .wrapn{position:relative;display:grid;place-items:center;}
.tabbar .nbadge{position:absolute;inset-block-start:-5px;inset-inline-end:-9px;}

/* ---- 2.3 search & filters -------------------------------- */
.search{display:flex;align-items:center;gap:var(--s-2);position:relative;
  min-height:var(--ctrl-sm);width:100%;
  padding:0 var(--s-3);background:var(--panel);border:var(--bw-ctrl) solid var(--line2);
  border-radius:var(--r-1);color:var(--ink3);font-size:var(--fs-sm);
  font-family:inherit;text-align:start;cursor:pointer;}
.search::after{content:"";position:absolute;inset-inline:0;inset-block:-5px;}
.search>svg{width:18px;height:18px;flex:none;}
.filters{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center;}
.fchip{display:inline-flex;align-items:center;gap:var(--s-2);position:relative;
  min-height:var(--ctrl-sm);
  padding:0 var(--s-4);border:var(--bw-ctrl) solid var(--line);border-radius:var(--r-pill);
  background:var(--panel);font-family:inherit;font-size:var(--fs-sm);color:var(--ink);cursor:pointer;}
.fchip::after{content:"";position:absolute;inset-inline:0;inset-block:-5px;}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.fchip .n{font-family:var(--mono);font-size:var(--fs-micro);}
.count{display:flex;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap;
  font-family:var(--mono);font-size:var(--fs-label);color:var(--ink3);}

/* ---- 2.4 list row + 2.12 progress ------------------------ */
.lrow{display:flex;align-items:stretch;background:var(--panel);
  border-block-end:var(--bw-hair) solid var(--line);min-height:var(--ctrl-lg);
  cursor:pointer;text-decoration:none;color:inherit;
  width:100%;border-inline:0;border-block-start:0;font-family:inherit;font-size:inherit;text-align:start;}
.lrow-lead{width:var(--bw-status);background:var(--st-pending);flex:none;}
.lrow-lead.s-accepted,.lrow-lead.s-progress{background:var(--st-progress);}
.lrow-lead.s-closed{background:var(--st-closed);}
.lrow-lead.s-cancelled{background:var(--st-cancelled);}
.lrow-lead.s-overdue{background:var(--alert);}
.lrow-b{flex:1;min-width:0;padding:var(--s-3) var(--s-4);display:flex;flex-direction:column;gap:var(--s-1);}
.lrow-1{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap;}
.lrow-id{font-family:var(--mono);font-size:var(--fs-value);font-weight:600;color:var(--ink2);
  direction:ltr;unicode-bidi:isolate;}
.lrow-2{display:flex;align-items:baseline;gap:var(--s-2);flex-wrap:wrap;color:var(--ink);}
.lrow-m{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:700;}
.lrow-u{font-size:var(--fs-label);font-weight:600;color:var(--ink2);white-space:nowrap;
  padding:1px var(--s-2);background:var(--fill);border:var(--bw-hair) solid var(--line);
  border-radius:var(--r-1);}
.lrow-3{font-size:var(--fs-label);color:var(--ink3);display:flex;gap:var(--s-3);flex-wrap:wrap;}
.lrow-go{display:grid;place-items:center;width:var(--touch-min);color:var(--ink3);flex:none;}

.lrow-req{display:flex;align-items:center;gap:var(--s-2) var(--s-4);flex-wrap:wrap;
  margin-block-start:var(--s-2);padding:var(--s-2) var(--s-3);
  background:var(--fill);border-inline-start:var(--bw-emph) solid var(--ink2);
  border-radius:var(--r-1);}
.rq-k{font-size:var(--fs-label);font-weight:600;letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink3);}
.rq-p{display:inline-flex;align-items:baseline;gap:var(--s-2);}
.rq-t{font-family:var(--mono);font-size:var(--fs-label);font-weight:700;color:var(--ink3);
  direction:ltr;unicode-bidi:isolate;}
.rq-n{font-family:var(--mono);font-size:var(--fs-value-lg);font-weight:700;line-height:1.1;
  color:var(--ink);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
.rq-w{flex-basis:100%;font-size:var(--fs-sm);font-weight:600;color:var(--warn);}

.cards{display:flex;flex-direction:column;gap:var(--s-3);
  padding:var(--s-3) var(--s-4) var(--s-6);}
.card{position:relative;display:flex;align-items:stretch;width:100%;
  background:var(--panel);border:var(--bw-hair) solid var(--line);
  border-inline-start:var(--bw-status) solid var(--st-pending);
  border-radius:var(--r-2);box-shadow:var(--shadow-1);overflow:hidden;
  font-family:inherit;font-size:inherit;text-align:start;color:inherit;cursor:pointer;}
.card.s-accepted,.card.s-progress{border-inline-start-color:var(--st-progress);}
.card.s-closed{border-inline-start-color:var(--st-closed);}
.card.s-cancelled{border-inline-start-color:var(--st-cancelled);}
.card.s-overdue{border-inline-start-color:var(--alert);}
.card.s-upcoming{border-inline-start-color:var(--warn);}
.card.s-none{border-inline-start-color:var(--line2);}
.card-b{flex:1;min-width:0;padding:var(--s-3) var(--s-4);
  display:flex;flex-direction:column;gap:var(--s-1);}

.hl{display:flex;align-items:baseline;gap:var(--s-2);}
.hl .m{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:700;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hl .u{font-size:var(--fs-label);font-weight:600;color:var(--ink2);white-space:nowrap;flex:none;
  padding:1px var(--s-2);background:var(--fill);border:var(--bw-hair) solid var(--line);
  border-radius:var(--r-1);}
.hl .id{margin-inline-start:auto;flex:none;font-family:var(--mono);font-size:var(--fs-micro);
  color:var(--ink3);direction:ltr;unicode-bidi:isolate;}

.flags{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;}
.flags:empty{display:none;}
.card-meta{display:flex;align-items:center;gap:var(--s-1) var(--s-3);flex-wrap:wrap;
  font-size:var(--fs-label);color:var(--ink3);}
.card-meta .hot{color:var(--alert);font-weight:700;}

.reqi{display:flex;align-items:baseline;gap:var(--s-2) var(--s-4);flex-wrap:wrap;
  margin-block-start:var(--s-1);font-size:var(--fs-label);}
.reqi .k{color:var(--ink3);font-weight:600;letter-spacing:var(--tracking-label);
  text-transform:uppercase;}
.reqi .p{display:inline-flex;align-items:baseline;gap:5px;}
.reqi .t{font-family:var(--mono);color:var(--ink3);direction:ltr;unicode-bidi:isolate;}
.reqi .n{font-family:var(--mono);font-size:var(--fs-value);font-weight:700;color:var(--ink);
  direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
.reqi .w{flex-basis:100%;font-size:var(--fs-micro);font-weight:600;color:var(--warn);}

.act1{display:flex;margin-block-start:var(--s-2);}
.act1 .btn{position:relative;flex:1;width:auto;min-height:var(--ctrl-sm);
  font-size:var(--fs-sm);box-shadow:none;}
.act1 .btn::after{content:"";position:absolute;inset-inline:0;inset-block:-5px;}

.progs{display:flex;align-items:center;gap:var(--s-2);margin-block-start:2px;}
.progs .t{position:relative;flex:1;height:5px;overflow:hidden;
  background:var(--fill2);border-radius:var(--r-pill);}
.progs .f{position:absolute;inset-block:0;inset-inline-start:0;background:var(--st-progress);
  border-radius:var(--r-pill);}
.progs .f.over{background:var(--warn);}
.progs .v{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink2);
  min-width:44px;text-align:end;direction:ltr;unicode-bidi:isolate;}
.progs .k{font-size:var(--fs-micro);color:var(--ink3);min-width:26px;
  direction:ltr;unicode-bidi:isolate;}

.reqhero{display:flex;align-items:center;gap:var(--s-2) var(--s-5);flex-wrap:wrap;
  padding:var(--s-3) var(--s-4);background:var(--accent-soft);
  border:var(--bw-ctrl) solid var(--accent);border-radius:var(--r-2);}
.reqhero .k{flex-basis:100%;font-size:var(--fs-label);font-weight:600;
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--accent);}
.reqhero .p{display:inline-flex;align-items:baseline;gap:var(--s-2);}
.reqhero .t{font-family:var(--mono);font-size:var(--fs-sm);font-weight:700;color:var(--accent);
  direction:ltr;unicode-bidi:isolate;}
.reqhero .v{font-family:var(--mono);font-size:var(--fs-value-xl);font-weight:700;line-height:1.05;
  color:var(--accent);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
.prog{display:flex;align-items:center;gap:var(--s-2);}
.prog-t{flex:1;height:8px;background:var(--fill2);border:0;border-radius:var(--r-pill);
  position:relative;overflow:hidden;}
.prog-f{position:absolute;inset-block:0;inset-inline-start:0;background:var(--st-progress);
  border-radius:var(--r-pill);}
.prog-f.over{background:var(--warn);}
.prog-v{font-family:var(--mono);font-size:var(--fs-label);color:var(--ink2);min-width:34px;text-align:end;}

/* ---- 2.8 pagination -------------------------------------- */
.pager{display:flex;align-items:center;justify-content:center;gap:var(--s-3);
  padding:var(--s-3);font-family:var(--mono);font-size:var(--fs-label);color:var(--ink3);
  background:var(--sheet);border-block-start:var(--bw-hair) solid var(--line);}

/* ---- 2.5 collapsible ------------------------------------- */
.coll{border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-1);background:var(--panel);}
.coll>summary{list-style:none;display:flex;align-items:center;gap:var(--s-2);
  min-height:var(--touch-comfort);padding:0 var(--s-3);cursor:pointer;font-size:var(--fs-sm);font-weight:600;}
.coll>summary::-webkit-details-marker{display:none;}
.coll>summary .n{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink3);margin-inline-start:auto;}
.coll>summary svg{transition:transform var(--dur-micro) var(--ease);}
.coll[open]>summary svg{transform:rotate(90deg);}
:root[dir="rtl"] .coll[open]>summary svg.icon-dir{transform:scaleX(-1) rotate(90deg);}
.coll-b{border-block-start:var(--bw-hair) solid var(--line);padding:var(--s-3);font-size:var(--fs-sm);color:var(--ink2);}

/* ---- 2.6 / 2.7 overlays ---------------------------------- */
.sheetc{background:var(--panel);border:var(--bw-ctrl) solid var(--line2);
  border-radius:var(--r-3) var(--r-3) 0 0;box-shadow:var(--shadow-overlay);overflow:hidden;}
.grab{width:36px;height:4px;background:var(--line2);border-radius:var(--r-pill);margin:var(--s-2) auto 0;}
.sheetc-h{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4);
  border-block-end:var(--bw-hair) solid var(--line);}
.sheetc-h b{font-size:var(--fs-h2);flex:1;}
.sheetc-b{padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-4);}
.sheetc-f{display:flex;gap:var(--s-3);padding:var(--s-4);border-block-start:var(--bw-hair) solid var(--line);}
.sheetc-f .btn{flex:1;min-height:var(--ctrl-lg);}
.dialog{background:var(--panel);border:var(--bw-ctrl) solid var(--line2);
  border-radius:var(--r-2);box-shadow:var(--shadow-dialog);max-width:340px;overflow:hidden;}
.dialog.stop{border-color:var(--alert);border-width:var(--bw-emph);}
.dialog.stop .dialog-b h4{color:var(--alert);}
.dialog-b{padding:var(--s-4);}
.dialog-b h4{margin:0 0 var(--s-2);font-size:var(--fs-h3);}
.dialog-b p{margin:0;font-size:var(--fs-sm);color:var(--ink2);}
.dialog-b p+p{margin-top:var(--s-2);}
.toast{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);
  border-radius:var(--r-1);background:var(--brand-navy);color:#fff;font-size:var(--fs-sm);}
.toast.ok{background:var(--ok-soft);color:var(--ok);border:var(--bw-ctrl) solid var(--ok);}
.toast.err{background:var(--alert-soft);color:var(--alert);border:var(--bw-ctrl) solid var(--alert);}
.toast svg{flex:none;}

/* ---- 2.16 grease banner ---------------------------------- */
.gbanner{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);
  background:linear-gradient(135deg,var(--brand-navy) 0%,var(--brand-blue-deep) 100%);
  color:#fff;border-radius:var(--r-2);box-shadow:var(--shadow-1);}
.gbanner svg{flex:none;}
.gbanner .k{font-size:var(--fs-micro);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#A8BCC8;}
.gbanner .n{font-size:var(--fs-micro);color:#A8BCC8;}
.gbanner .v{font-family:var(--mono);font-size:var(--fs-h2);font-weight:600;}

/* ---- 2.17 PTW -------------------------------------------- */
.ptw{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3);
  border:var(--bw-ctrl) dashed var(--line2);border-radius:var(--r-1);background:var(--fill);}
.ptw .grow{flex:1;min-width:0;}
.ptw .k{font-size:var(--fs-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink3);}
.ptw .v{font-family:var(--mono);font-size:var(--fs-value);font-weight:600;direction:ltr;unicode-bidi:isolate;}
.ptw .s{font-size:var(--fs-micro);color:var(--ink2);}
.ptw svg{flex:none;}
.ptw.expired{border-style:solid;border-color:var(--alert);background:var(--alert-soft);}
.ptw.expired .k{color:var(--alert);}
.ptw.soon{border-style:solid;border-color:var(--warn);background:var(--warn-soft);}
.ptw.soon .k{color:var(--warn);}

/* ---- 2.13 shots stepper ---------------------------------- */
.shots{border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-1);background:var(--panel);}
.shots-h{display:flex;align-items:baseline;gap:var(--s-2);padding:var(--s-3) var(--s-3) 0;}
.shots-h .k{font-size:var(--fs-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink3);}
.shots-h .req{margin-inline-start:auto;font-family:var(--mono);font-size:var(--fs-sm);
  font-weight:700;color:var(--ink);}
.shots-c{display:flex;align-items:stretch;gap:var(--s-2);padding:var(--s-3);}
.shots-c button{width:var(--ctrl-lg);height:var(--ctrl-lg);flex:none;
  border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-1);
  background:var(--fill);color:var(--ink);cursor:pointer;display:grid;place-items:center;}
.shots-c button[disabled]{color:var(--ink2);background:var(--fill2);border-color:var(--line);cursor:not-allowed;}
.shots-c .shots-v{flex:1;width:auto;height:auto;min-width:0;padding:var(--s-2) var(--s-3);}
.shots-v{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-1);background:var(--panel);cursor:text;
  font-family:inherit;color:inherit;}
.shots-v .n{font-family:var(--mono);font-size:var(--fs-value-xl);font-weight:600;line-height:1;}
.shots-v .u{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink3);margin-top:4px;}
.shots.warn{border-color:var(--warn);border-width:var(--bw-emph);}
.shots.ro .shots-v{border-style:dashed;background:var(--fill);}
.shots-msg{padding:0 var(--s-3) var(--s-3);font-size:var(--fs-sm);color:var(--ink2);}
.shots-msg.warn{color:var(--warn);}
.step-k{font-family:var(--mono);font-size:9px;color:var(--ink2);display:block;margin-top:2px;}

/* ---- 2.14 bearing block ---------------------------------- */
.bearing{border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-2);background:var(--sheet);overflow:hidden;}
.bearing-h{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-4);
  background:var(--fill);border-block-end:var(--bw-hair) solid var(--line);}
.bearing-h b{font-size:var(--fs-h3);}
.bearing-h .kks{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink3);margin-inline-start:auto;
  direction:ltr;unicode-bidi:isolate;}
.bearing-b{padding:var(--s-3);display:flex;flex-direction:column;gap:var(--s-3);}

/* ---- 2.15 temperature tile ------------------------------- */
.temp{border:var(--bw-ctrl) dashed var(--line2);border-radius:var(--r-1);background:var(--fill);padding:var(--s-3);}
.temp .k{display:block;font-size:var(--fs-label);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink3);}
.temp .v{display:block;white-space:nowrap;font-family:var(--mono);font-size:var(--fs-value-lg);
  font-weight:600;line-height:1.15;margin-top:var(--s-1);}
.temp .v.big{font-size:var(--fs-value-xl);}
.temp .s{font-size:var(--fs-micro);color:var(--ink3);margin-top:var(--s-1);display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.temp.stale{border-color:var(--st-pending);}
.temp.stale .s{color:var(--st-pending);}
.temp.none .v{color:var(--ink3);font-size:var(--fs-h3);}
.temp.off .v{color:var(--ink3);font-size:var(--fs-h3);}
.temp.d-warn{border-color:var(--warn);}
.temp.d-warn .v,.temp.d-warn .s{color:var(--warn);}
.temp.d-alert{border-color:var(--alert);border-width:var(--bw-emph);}
.temp.d-alert .v,.temp.d-alert .s{color:var(--alert);}
.dband{font-family:var(--sans);font-size:var(--fs-micro);font-weight:600;
  text-transform:uppercase;letter-spacing:var(--tracking-label);}
.tempgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(148px,100%),1fr));gap:var(--s-2);}

/* ---- 2.18 photos ----------------------------------------- */
.photos{display:flex;gap:var(--s-2);flex-wrap:wrap;}
.photo{width:64px;height:64px;border:var(--bw-hair) solid var(--line2);background:var(--fill2);
  display:grid;place-items:center;color:var(--ink2);font-family:var(--mono);font-size:10px;}
.photo-add{width:64px;height:64px;border:var(--bw-ctrl) dashed var(--line2);background:var(--panel);
  display:grid;place-items:center;color:var(--accent);cursor:pointer;}

/* ---- 2.19 page states ------------------------------------ */
.pstate{display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:var(--s-3);padding:var(--s-8) var(--s-5);color:var(--ink2);background:var(--panel);}
.pstate svg{color:var(--ink3);}
.pstate b{color:var(--ink);font-size:var(--fs-h3);}
.pstate p{margin:0;font-size:var(--fs-sm);max-width:34ch;}
.skelrow{padding:var(--s-3) var(--s-4);border-block-end:var(--bw-hair) solid var(--line);
  display:flex;flex-direction:column;gap:var(--s-2);background:var(--panel);}
.skel{background:var(--fill2);height:11px;border-radius:var(--r-1);}
.offline{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-4);
  background:var(--warn-soft);color:var(--warn);font-size:var(--fs-sm);
  border-block-end:var(--bw-ctrl) solid var(--warn);}

/* ---- 2.20 connectivity bar ------------------------------- */
.conn{display:flex;width:100%;align-items:center;gap:var(--s-2);text-align:start;
  padding:var(--s-2) var(--s-4);min-height:var(--touch-min);font-family:inherit;
  font-size:var(--fs-sm);cursor:pointer;border:0;border-block-end:var(--bw-ctrl) solid;}
.conn svg{flex:none;}
.conn .cta{margin-inline-start:auto;font-size:var(--fs-micro);text-decoration:underline;
  white-space:nowrap;}
.conn.off{background:var(--warn-soft);color:var(--warn);}
.conn.syncing{background:var(--accent-soft);color:var(--accent);}
.conn.err{background:var(--alert-soft);color:var(--alert);}

/* ---- 2.21 sync state of a record ------------------------- */
.sync{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);
  font-size:var(--fs-micro);line-height:1;padding:3px 6px;border-radius:var(--r-1);
  border:var(--bw-hair) solid currentColor;direction:ltr;unicode-bidi:isolate;white-space:nowrap;}
.sync svg{flex:none;}
.sync.q{color:var(--st-pending);}
.sync.s{color:var(--accent);}
.sync.c,.sync.r{color:var(--alert);border-width:var(--bw-ctrl);}
.nbadge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;
  background:var(--alert);color:var(--on-accent);font-family:var(--mono);font-size:11px;
  border-radius:var(--r-pill);}

/* ---- 2.22 freshness stamp + sync queue row --------------- */
.fresh{display:flex;align-items:center;gap:5px;padding:var(--s-2) var(--s-4);
  background:var(--fill);color:var(--ink2);font-size:var(--fs-micro);
  border-block-end:var(--bw-hair) solid var(--line);}
.fresh svg{flex:none;}
.qrow{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-3) var(--s-4);
  background:var(--panel);border-block-end:var(--bw-hair) solid var(--line);}
.qrow .qb{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s-1);}
.qrow .qt{font-size:var(--fs-body);color:var(--ink);}
.qrow .qm{font-size:var(--fs-micro);color:var(--ink3);display:flex;gap:var(--s-2);flex-wrap:wrap;}

.note{margin:0;padding:var(--s-3) var(--s-4);background:var(--fill);
  border-inline-start:var(--bw-status) solid var(--line2);font-size:var(--fs-sm);color:var(--ink2);}
.note.rule{border-inline-start-color:var(--accent);}
.note.risk{border-inline-start-color:var(--alert);background:var(--alert-soft);color:var(--ink);}
.note b{color:var(--ink);}


/* ---- 2.24 SegmentedTabs — the list-family switcher -------- */
.segs{display:flex;background:var(--panel);border-block-end:var(--bw-hair) solid var(--line);
  overflow-x:auto;}
.segs button{flex:1 0 auto;position:relative;min-height:var(--ctrl-md);padding:0 var(--s-3);
  border:0;background:none;cursor:pointer;color:var(--ink3);
  font-family:inherit;font-size:var(--fs-sm);white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;}
.segs button .n{font-family:var(--mono);font-size:var(--fs-micro);}
.segs button::after{content:"";position:absolute;inset-inline:0;inset-block:-2px;}
.segs button[aria-selected="true"]{color:var(--accent);font-weight:700;
  background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent);}

/* ---- 2.25 KeyValueRow — read-only detail pairs ------------ */
.kv{display:flex;gap:var(--s-3);align-items:baseline;padding:var(--s-2) 0;
  border-block-end:var(--bw-hair) solid var(--line);}
.kv:last-child{border-block-end:0;}
.kv .k{font-size:var(--fs-label);color:var(--ink3);flex:none;min-width:96px;}
.kv .v{font-size:var(--fs-sm);color:var(--ink);flex:1;min-width:0;text-align:end;}
.kv .v small{display:block;font-size:var(--fs-micro);color:var(--ink3);}

/* ---- 2.26 SectionHeader — in-screen grouping -------------- */
.sect{font-family:var(--sans);font-size:var(--fs-label);font-weight:700;letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink3);
  display:flex;align-items:center;gap:var(--s-2);}
.sect::after{content:"";flex:1;height:var(--bw-hair);background:var(--line);}

/* ---- 2.27 CheckRow — bearing selection -------------------- */
.chk{display:flex;align-items:center;gap:var(--s-3);width:100%;min-height:var(--touch-comfort);
  padding:0 var(--s-3);background:var(--panel);border:var(--bw-ctrl) solid var(--line2);
  border-radius:var(--r-1);font-family:inherit;font-size:var(--fs-body);color:var(--ink);
  cursor:pointer;text-align:start;}
.chk .box{width:22px;height:22px;flex:none;border:var(--bw-emph) solid var(--line2);
  border-radius:var(--r-1);display:grid;place-items:center;color:transparent;}
.chk[aria-pressed="true"]{border-color:var(--accent);}
.chk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.chk .grow{flex:1;min-width:0;}
.chk .hint{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink3);}

/* ---- 2.28 TokenList — removable multi-select values ------- */
.tokens{display:flex;flex-direction:column;border:var(--bw-ctrl) solid var(--line);
  border-radius:var(--r-1);overflow:hidden;}
.tokens .tk{display:flex;align-items:center;gap:var(--s-2);min-height:var(--touch-min);
  padding-inline-start:var(--s-3);background:var(--panel);
  border-block-end:var(--bw-hair) solid var(--line);}
.tokens .tk:last-child{border-block-end:0;}
.tokens .tk .grow{flex:1;min-width:0;font-size:var(--fs-sm);}
.tokens .tk .kks{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink3);
  direction:ltr;unicode-bidi:isolate;}
.tokens .tk button{width:var(--touch-min);height:var(--touch-min);flex:none;border:0;
  background:none;color:var(--ink3);cursor:pointer;display:grid;place-items:center;}

/* ---- 2.29 RowActions — actions inside a list row ---------- */
.rowact{display:flex;gap:var(--s-2);margin-top:var(--s-3);}
.rowact .btn{position:relative;flex:0 1 auto;min-height:var(--ctrl-sm);min-width:0;
  width:auto;padding:0 var(--s-4);font-size:var(--fs-sm);box-shadow:none;}
.rowact .btn::after{content:"";position:absolute;inset-inline:0;inset-block:-5px;}
.rowact .btn-primary{flex:1 1 auto;}

/* ---- 2.31 ButtonRow — sibling actions of equal weight ----- */
.btnrow{display:flex;gap:var(--s-3);}
.btnrow .btn{flex:1;min-height:var(--ctrl-lg);width:auto;}

/* ---- 2.30 RadioRow — single choice from a fixed list ------ */
.radios{display:flex;flex-direction:column;border:var(--bw-ctrl) solid var(--line);
  border-radius:var(--r-1);overflow:hidden;}
.radios button{display:flex;align-items:center;gap:var(--s-3);min-height:var(--touch-comfort);
  padding:0 var(--s-3);border:0;border-block-end:var(--bw-hair) solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;
  font-family:inherit;font-size:var(--fs-body);text-align:start;}
.radios button:last-child{border-block-end:0;}
.radios .dot{width:20px;height:20px;flex:none;border-radius:var(--r-pill);
  border:var(--bw-emph) solid var(--line2);background:transparent;}
.radios button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.radios .n{margin-inline-start:auto;font-size:var(--fs-label);color:var(--ink2);}
.radios button[aria-checked="true"] .n{color:var(--accent);}
.radios button[aria-checked="true"] .dot{border-color:var(--accent);background:var(--accent);
  box-shadow:inset 0 0 0 3px var(--accent-soft);}

html,body{height:100%;}
body{margin:0;background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,var(--grid-line) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(90deg,var(--grid-line) 0 1px,transparent 1px 24px);
  color:var(--ink);font-family:var(--sans);font-size:var(--fs-body);line-height:var(--lh-body);
  -webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;}

.pbar{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-2);align-items:center;
  padding:var(--s-2) var(--s-3);background:var(--sheet);
  border-block-end:var(--bw-hair) solid var(--line);flex:none;}
.pbar-t{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);margin-inline-end:auto;}
.tg{display:flex;border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-1);overflow:hidden;}
.tg button{min-height:30px;padding:0 var(--s-2);border:0;background:var(--panel);
  color:var(--ink2);font-family:var(--mono);font-size:10px;letter-spacing:.04em;cursor:pointer;}
.tg button+button{border-inline-start:var(--bw-hair) solid var(--line);}
.tg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);}
.tg-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);align-self:center;margin-inline-start:var(--s-2);}

.stage{flex:1;min-height:0;display:flex;gap:var(--s-5);justify-content:center;
  align-items:stretch;padding:var(--s-5) var(--s-4);overflow:auto;}
.device{width:100%;max-width:390px;flex:none;
  height:min(812px,100%);align-self:center;
  border:var(--bw-ctrl) solid var(--line);background:var(--sheet);
  border-radius:var(--r-3);box-shadow:var(--shadow-2);
  position:relative;overflow:hidden;display:flex;flex-direction:column;}
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--sheet);}
.app-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
.pad{padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3);}
.pad.tight{gap:var(--s-2);}
.pad>.sect{margin-block-start:var(--s-3);}
.pad>.sect:first-child{margin-block-start:0;}
.flush{display:flex;flex-direction:column;}
.nest{margin-inline-start:var(--s-5);}
.age{font-size:var(--fs-label);color:var(--ink3);}

.ovl{position:absolute;inset:0;background:var(--scrim);display:flex;z-index:20;}
.ovl.bottom{align-items:flex-end;}
.ovl.center{align-items:center;justify-content:center;padding:var(--s-4);}
.ovl.bottom>*{width:100%;max-height:100%;overflow-y:auto;}
.ovl.center>*{max-height:100%;overflow-y:auto;}
.toastwrap{position:absolute;inset-inline:var(--s-4);inset-block-end:calc(var(--touch-comfort) + var(--s-4));
  z-index:30;box-shadow:var(--shadow-dialog);}

.rail{flex:1;max-width:340px;background:var(--sheet);border:var(--bw-hair) solid var(--line2);
  padding:var(--s-4);font-size:var(--fs-sm);color:var(--ink2);display:none;
  align-self:flex-start;max-height:100%;overflow-y:auto;}
.rail h2{font-size:var(--fs-h3);margin:0 0 var(--s-2);color:var(--ink);}
.rail h3{font-family:var(--mono);font-size:var(--fs-micro);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink3);margin:var(--s-4) 0 var(--s-2);}
.rail ul{margin:0;padding-inline-start:var(--s-4);}
.rail li{margin-bottom:var(--s-1);}
.rail code{font-family:var(--mono);font-size:var(--fs-micro);}
@media (min-width:1024px){ .rail{display:block;} }

.stage.full .device{max-width:none;width:100%;height:100%;border-width:var(--bw-hair);}
.stage.full .rail{display:none;}
.stage.full .pad{max-width:860px;margin-inline:auto;width:100%;}
.stage.full .segs,.stage.full .fresh,.stage.full .conn,
.stage.full .gate,.stage.full .actbar{padding-inline:max(var(--s-4),calc((100% - 860px)/2));}
.stage.full .lrow-b{max-width:860px;margin-inline:auto;width:100%;}
.stage.full .lrow{background:var(--panel);}
.stage.full .cards{max-width:calc(860px + var(--s-8));margin-inline:auto;width:100%;}

.stage.full .pad.wide{max-width:1200px;}
.stage.full .cards.wide{max-width:1200px;display:grid;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));}
.stage.full .pad.wide .cards{max-width:none;}

.split-l,.split-r{display:flex;flex-direction:column;gap:var(--s-3);min-width:0;}
.split-r{display:none;}
.split.on .split-l{display:none;}
.split.on .split-r{display:flex;}
.stage.full .split{display:grid;gap:var(--s-5);align-items:start;
  grid-template-columns:minmax(260px,320px) minmax(0,1fr);}
.stage.full .split-l,.stage.full .split.on .split-l,
.stage.full .split-r,.stage.full .split.on .split-r{display:flex;}
.split-l>.sect:first-child,.split-r>.sect:first-child{margin-block-start:0;}

.stage.full{--nav-w:236px;}
.stage.full .app{position:relative;}

.stage.full .app:has(>.tabbar){padding-inline-start:var(--nav-w);}
.stage.full .tabbar{position:absolute;z-index:6;inset-block:0;inset-inline-start:0;
  width:var(--nav-w);flex-direction:column;justify-content:flex-start;gap:var(--s-1);
  padding:var(--s-3) var(--s-2);border-block-start:0;
  border-inline-end:var(--bw-ctrl) solid var(--line2);}
.stage.full .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;
  gap:var(--s-3);min-height:var(--ctrl-lg);padding:var(--s-2) var(--s-3);
  font-size:var(--fs-sm);border-radius:var(--r-1);
  border-inline-start:var(--bw-status) solid transparent;}
.stage.full .tabbar button[aria-current="page"]{box-shadow:none;background:var(--fill);
  border-inline-start-color:var(--accent);}

.stage.full .appbar{padding-inline:max(var(--s-2),calc((100% - 860px)/2));}
.stage.full .app:has(.pad.wide) .appbar{padding-inline:max(var(--s-2),calc((100% - 1200px)/2));}
.stage.full .app:has(.pad.wide) :is(.segs,.fresh,.conn,.gate){
  padding-inline:max(var(--s-4),calc((100% - 1200px)/2));}

.stage.full .ovl.bottom{align-items:center;justify-content:center;padding:var(--s-5);}
.stage.full .ovl.bottom>*{width:min(560px,100%);}
.stage.full .ovl.bottom .sheetc{border-radius:var(--r-3);}
.stage.full .ovl.bottom .grab{display:none;}
.stage.full .ovl.center>.dialog{max-width:420px;}

.stage.full .toastwrap{inset-inline-start:auto;inset-inline-end:var(--s-5);
  inset-block-end:var(--s-5);max-width:420px;}
.stage.full .app:has(>.actbar) .toastwrap{inset-block-end:calc(var(--ctrl-lg) + var(--s-8));}

.stage.full .app:has(.brand) .pad{max-width:400px;
  background:var(--fill);border:var(--bw-hair) solid var(--line);
  border-radius:var(--r-3);padding:var(--s-6);box-shadow:var(--shadow-1);}
.stage.full .app:has(.brand) .app-scroll{display:grid;align-content:safe center;}
.stage.full .app:has(.brand) .brand{padding-block:0 var(--s-4);}

@media (max-width:600px){
  .stage{padding:0;}
  .device{max-width:none;height:100%;border-inline:0;}
  .pbar{padding-inline:var(--s-3);}
}

.bearing,.coll,.radios,.tokens,.shots{box-shadow:var(--shadow-1);}

.lrow,.card,.chk,.fchip,.segs button,.coll>summary,.radios button,.field-c,.search,
.shots-c button,.photo-add,.conn,.tokens .tk button,.tabbar a,.tabbar button{
  transition:background var(--dur-micro) var(--ease),
             border-color var(--dur-micro) var(--ease),
             color var(--dur-micro) var(--ease);}

@media (hover:hover){
  .lrow:hover,.card:hover,.chk:hover,.coll>summary:hover,.radios button:hover{background:var(--fill);}
  .fchip:hover,.segs button:hover{color:var(--accent);border-color:var(--accent);}
  .shots-c button:not([disabled]):hover,.photo-add:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
}
.lrow:active,.card:active,.chk:active,.radios button:active{background:var(--fill2);}
.shots-c button:not([disabled]):active{transform:scale(.94);}

@keyframes ovlIn  {from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ovl{animation:ovlIn var(--dur-micro) var(--ease) both;}
.ovl>*{animation:sheetIn var(--dur-sheet) var(--ease-out) both;}
.toastwrap{animation:toastIn var(--dur-sheet) var(--ease-out) both;border-radius:var(--r-1);}


:root[dir="rtl"] .icon-dir{transform:scaleX(-1);}

.gate{flex:none;display:flex;align-items:flex-start;gap:var(--s-2);
  padding:var(--s-2) var(--s-4);font-size:var(--fs-sm);font-weight:600;
  background:var(--accent-soft);color:var(--accent);
  border-block-end:var(--bw-hair) solid var(--line);}
.gate svg{flex:none;margin-block-start:2px;}
.gate .s{font-weight:400;}
.gate .s::before{content:" — ";}
.gate.blk{background:var(--alert-soft);color:var(--alert);}
.gate.warn{background:var(--warn-soft);color:var(--warn);}
.gate.ro{background:var(--fill);color:var(--ink2);}
.gate.ok{background:var(--ok-soft);color:var(--ok);}

.gstrip{display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-2) var(--s-3);border-radius:var(--r-1);
  background:var(--brand-navy);color:#fff;}
.gstrip svg{flex:none;}
.gstrip .k{font-size:var(--fs-micro);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:#A8BCC8;display:block;}
.gstrip .v{font-family:var(--mono);font-size:var(--fs-value);font-weight:600;
  direction:ltr;unicode-bidi:isolate;}
.gstrip .n{margin-inline-start:auto;font-size:var(--fs-micro);color:#A8BCC8;text-align:end;}

.actbar{flex:none;display:flex;flex-direction:column;gap:var(--s-2);
  padding:var(--s-3) var(--s-4);background:var(--panel);
  border-block-start:var(--bw-ctrl) solid var(--line2);box-shadow:var(--shadow-overlay);}
.actbar .row{display:flex;gap:var(--s-2);align-items:stretch;}
.actbar .row .btn{width:auto;}
.actbar .row .btn-primary{flex:1;}
.actbar .row .btn-secondary,.actbar .row .btn-blocked{flex:0 0 auto;padding-inline:var(--s-4);}
.actbar .row .ab-more{flex:0 0 auto;width:var(--ctrl-lg);min-width:var(--ctrl-lg);padding:0;
  background:var(--panel);border:var(--bw-ctrl) solid var(--line2);color:var(--ink2);}
.actbar .why{display:flex;align-items:flex-start;gap:var(--s-2);
  font-size:var(--fs-sm);color:var(--alert);}
.actbar .why svg{flex:none;margin-block-start:1px;}
.actbar .why.q{color:var(--ink2);}

.heros{display:flex;flex-direction:column;gap:var(--s-2);}
.heros-k{font-size:var(--fs-label);font-weight:600;letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink3);}
.hero{display:flex;flex-direction:column;gap:var(--s-2);
  padding:var(--s-3) var(--s-4);background:var(--panel);
  border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-2);box-shadow:var(--shadow-1);}
.hero-1{display:flex;align-items:baseline;gap:var(--s-2);}
.hero-1 .k{font-family:var(--mono);font-size:var(--fs-label);font-weight:700;
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink3);
  direction:ltr;unicode-bidi:isolate;}
.hero-1 .v{font-family:var(--mono);font-size:var(--fs-value-xl);font-weight:700;line-height:1.05;
  direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
.hero-1 .of{font-family:var(--mono);font-size:var(--fs-value);color:var(--ink3);
  direction:ltr;unicode-bidi:isolate;}
.hero-1 .pct{margin-inline-start:auto;font-family:var(--mono);font-size:var(--fs-value);color:var(--ink2);}
.hero .bar{position:relative;height:8px;overflow:hidden;
  background:var(--fill2);border-radius:var(--r-pill);}
.hero .bar i{position:absolute;inset-block:0;inset-inline-start:0;
  background:var(--st-progress);border-radius:var(--r-pill);}
.hero.over .v{color:var(--warn);}
.hero.over .bar i{background:var(--warn);}
.hero .msg{font-size:var(--fs-sm);color:var(--warn);}

.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2);}
.bgrid.one{grid-template-columns:1fr;}
.bcard{display:flex;flex-direction:column;background:var(--panel);
  border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-2);
  box-shadow:var(--shadow-1);overflow:hidden;}
.bcard.over{border-color:var(--warn);border-width:var(--bw-emph);}
.bcard-h{display:flex;align-items:baseline;gap:var(--s-2);flex-wrap:wrap;
  padding:var(--s-2) var(--s-3);background:var(--fill);
  border-block-end:var(--bw-hair) solid var(--line);}
.bcard-h b{font-family:var(--mono);font-size:var(--fs-sm);}
.bcard-h .req{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink2);
  margin-inline-start:auto;direction:ltr;unicode-bidi:isolate;}
.bcard-h .nm{flex-basis:100%;font-size:var(--fs-micro);color:var(--ink2);}
.bcard .val{display:flex;flex-direction:column;align-items:center;gap:2px;
  width:100%;padding:var(--s-2) var(--s-2) 0;border:0;background:none;
  color:var(--ink);font-family:inherit;}
.bcard button.val{cursor:pointer;}
.bcard .val .n{font-family:var(--mono);font-size:var(--fs-value-xl);font-weight:600;line-height:1;
  direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
.bcard.over .val .n{color:var(--warn);}
.bcard .val .u{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink3);}
.bcard .pair{display:flex;gap:var(--s-2);padding:var(--s-2);}
.bcard .pair button{flex:1;min-height:var(--ctrl-lg);
  border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-1);
  background:var(--panel);color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.bcard .pair button[disabled]{color:var(--ink2);background:var(--fill2);
  border-color:var(--line);cursor:not-allowed;}
.bcard .pair button:not([disabled]):active{transform:scale(.94);}
.bcard .tline{margin-block-start:auto;}

.tline{display:flex;align-items:baseline;gap:var(--s-2);flex-wrap:wrap;
  padding:var(--s-2) var(--s-3);border-block-start:var(--bw-hair) dashed var(--line);
  font-size:var(--fs-micro);color:var(--ink3);}
.tline .k{letter-spacing:var(--tracking-label);text-transform:uppercase;}
.bcard .tline .k{flex-basis:100%;}
.tline .v{font-family:var(--mono);font-size:var(--fs-value);color:var(--ink);
  direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
.tline .v.dim{color:var(--ink3);font-size:var(--fs-sm);font-family:var(--sans);}
.tline .to{color:var(--ink3);}
.tline .s{flex-basis:100%;color:var(--ink3);}

.idline{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;
  font-size:var(--fs-label);color:var(--ink3);}
.idline .age{margin-inline-start:auto;}
.coll-b.stack{display:flex;flex-direction:column;gap:var(--s-3);}
.jd-hint{font-size:var(--fs-micro);color:var(--ink3);}

/* ---- 2.39 NoteBox + smaller evidence thumbs ---------------- */
.nbox{display:flex;flex-direction:column;gap:var(--s-1);
  padding:var(--s-2) var(--s-3);background:var(--panel);
  border:var(--bw-ctrl) solid var(--line);border-radius:var(--r-1);}
.nbox .k{font-size:var(--fs-micro);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink3);font-weight:600;}
.nbox .v{font-size:var(--fs-sm);color:var(--ink);}
.nbox .v.ph{color:var(--ink3);}
.nbox.ro{border-style:dashed;background:var(--fill);}
.nbox-h{display:flex;align-items:center;gap:var(--s-2);}
.nbox .edit{margin-inline-start:auto;}
.photos.sm .photo,.photos.sm .photo-add{width:48px;height:48px;}
.photos.sm .photo{font-size:9px;}


/* ---- 2.41 BrandLock — whose app this is ------------------- */
.brand{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);
  padding-block:var(--s-7) var(--s-5);text-align:center;}
.brand svg{flex:none;}
.brand .n{font-size:var(--fs-h1);font-weight:700;letter-spacing:.08em;color:var(--ink);
  direction:ltr;unicode-bidi:isolate;}
.brand .s{font-size:var(--fs-sm);color:var(--ink2);max-width:30ch;}

/* ---- 2.42 TileGrid — the modules on Home ------------------ */
.tiles{display:grid;gap:var(--s-3);
  grid-template-columns:repeat(auto-fit,minmax(min(152px,100%),1fr));}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-1);
  min-height:var(--s-10);padding:var(--s-3) var(--s-4);background:var(--panel);
  border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-2);
  border-inline-start:var(--bw-status) solid var(--accent-graphic);
  font-family:inherit;color:var(--ink);text-align:start;cursor:pointer;}
.tile .k{font-family:var(--mono);font-size:var(--fs-micro);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink3);}
.tile .n{font-size:var(--fs-h3);font-weight:700;line-height:var(--lh-h3);}
.tile .s{font-size:var(--fs-sm);color:var(--ink2);margin-block-start:auto;
  padding-block-start:var(--s-2);}
.tile.res{border-inline-start-color:var(--st-pending);}
.tile.oth{border-inline-start-color:var(--line2);}

/* ---- 2.43 MenuList — the module's addressable rows -------- */
.menu{display:flex;flex-direction:column;background:var(--panel);
  border:var(--bw-ctrl) solid var(--line);border-radius:var(--r-1);overflow:hidden;}
.mrow{display:flex;align-items:center;gap:var(--s-3);width:100%;
  min-height:var(--touch-comfort);padding:var(--s-2) var(--s-3);
  background:var(--panel);border:0;border-block-end:var(--bw-hair) solid var(--line);
  font-family:inherit;font-size:var(--fs-body);color:var(--ink);
  text-align:start;cursor:pointer;}
.mrow:last-child{border-block-end:0;}
.mrow>svg{flex:none;color:var(--ink3);}
.mrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.mrow .s{font-size:var(--fs-micro);color:var(--ink3);}
.mrow .cnt{flex:none;font-family:var(--mono);font-size:var(--fs-label);color:var(--ink2);
  border:var(--bw-hair) solid var(--line2);border-radius:var(--r-pill);
  padding:2px var(--s-2);}
.mrow .cnt.hot{color:var(--alert);border-color:var(--alert);}
.mrow.dan{color:var(--alert);}
.mrow.dan>svg{color:var(--alert);}
.mrow[aria-current]{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.mrow[aria-current] .s{color:var(--accent);}

/* ---- 2.44 IdentityStrip — who is signed in, as what ------- */
.who{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);
  background:var(--accent-soft);border-block-end:var(--bw-hair) solid var(--line);}
.who .av{width:38px;height:38px;flex:none;border-radius:var(--r-pill);
  border:var(--bw-ctrl) solid var(--accent);background:var(--panel);
  display:grid;place-items:center;
  font-family:var(--mono);font-size:var(--fs-label);color:var(--accent);}
.who .grow{flex:1;min-width:0;display:flex;flex-direction:column;}
.who .n{font-size:var(--fs-body);font-weight:700;color:var(--ink);}
.who .r{font-size:var(--fs-sm);color:var(--ink2);}


.hero,.bcard,.shots{
  border-inline-start:var(--bw-status) solid var(--accent-graphic);}
.coll,.nbox{
  border-inline-start:var(--bw-status) solid var(--st-pending);}

.hero.over,.bcard.over,.shots.warn{border-inline-start-color:var(--warn);}

.bcard-h{
  background:linear-gradient(180deg,var(--accent-soft),var(--fill));}
.coll>summary{
  background:linear-gradient(180deg,var(--st-pending-soft),transparent);}

.prog-f,.progs .f,.hero .bar i{
  background:linear-gradient(180deg,var(--accent-graphic),var(--accent));}
.prog-f.over,.progs .f.over,.hero.over .bar i{
  background:linear-gradient(180deg,#D89A17,var(--warn));}
:root[data-theme="dark"] .prog-f,
:root[data-theme="dark"] .progs .f,
:root[data-theme="dark"] .hero .bar i{
  background:linear-gradient(180deg,var(--accent-hover),var(--accent));}
.prog-t,.hero .bar{background:var(--fill2);}

.temp{background:var(--st-pending-soft);border-style:solid;border-color:var(--line);}
.temp.stale{border-color:var(--st-pending);}
.temp.none,.temp.off{background:var(--fill);border-style:dashed;}
.temp.d-warn{background:var(--warn-soft);border-color:var(--warn);}
.temp.d-alert{background:var(--alert-soft);border-color:var(--alert);}
.temp.d-warn .k,.temp.d-alert .k{color:var(--ink2);}
.tline{background:var(--st-pending-soft);
  border-block-start-style:solid;border-block-start-color:var(--line);}

.gate{border-inline-start:var(--bw-status) solid currentColor;}
.gate.ro{background:var(--st-pending-soft);color:var(--st-pending);}

.gstrip,.gbanner{
  background:linear-gradient(180deg,var(--brand-blue-deep),var(--brand-navy));}

.btn-primary:not(.btn-blocked):not([disabled]){
  background:linear-gradient(180deg,var(--accent),var(--accent-hover));
  border-color:var(--accent-hover);}
:root[data-theme="dark"] .btn-primary:not(.btn-blocked):not([disabled]){
  background:linear-gradient(180deg,var(--accent-hover),var(--accent));}
@media (hover:hover){
  .btn-primary:not(.btn-blocked):not([disabled]):hover{
    background:var(--accent-hover);border-color:var(--accent-hover);}
}
.actbar{border-block-start-color:var(--accent-graphic);}

.tg-sel{min-height:30px;max-width:190px;padding:0 var(--s-2);
  border:var(--bw-ctrl) solid var(--line2);border-radius:var(--r-1);
  background:var(--panel);color:var(--ink2);
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;cursor:pointer;}


.route{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;
  padding:var(--s-2) var(--s-3);border-radius:var(--r-1);
  background:var(--brand-navy);color:#fff;}
.route svg{flex:none;}
.route .side{display:flex;flex-direction:column;min-width:0;flex:1;}
.route .k{font-size:var(--fs-micro);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:#A8BCC8;}
.route .v{font-size:var(--fs-sm);font-weight:600;line-height:1.3;}
.route .to{flex:none;color:#A8BCC8;}

.dept{display:inline-flex;align-items:center;gap:4px;max-width:100%;
  padding:1px var(--s-2);font-size:var(--fs-micro);font-weight:600;
  color:var(--ink2);background:var(--fill);
  border:var(--bw-hair) solid var(--line);border-radius:var(--r-1);}
.dept svg{flex:none;}
.dept span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dept.own{color:var(--accent);background:var(--accent-soft);border-color:var(--accent);}
.dept.lead{color:var(--ink);border-color:var(--line2);}

.depts{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;}

.fault{display:flex;flex-direction:column;gap:var(--s-2);
  padding:var(--s-3);background:var(--panel);
  border:var(--bw-ctrl) solid var(--line);border-radius:var(--r-2);}
.fault-h{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;}
.fault-h .k{font-size:var(--fs-micro);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink3);font-weight:600;}
.fault .d{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink);}
.fault .eq{display:flex;align-items:baseline;gap:var(--s-2);flex-wrap:wrap;
  padding-block-start:var(--s-2);border-block-start:var(--bw-hair) dashed var(--line);}
.fault .eq .n{font-size:var(--fs-h3);font-weight:700;color:var(--ink);}
.fault .eq .tag{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink3);
  direction:ltr;unicode-bidi:isolate;}

.trk{display:flex;flex-direction:column;}
.trk-s{position:relative;display:flex;gap:var(--s-3);padding-block-end:var(--s-4);}

function perms(j){
  const sup  = S.role === 'sup';
  const open = !!j && j.status !== 'CLOSED' && j.status !== 'CANCELLED';
  const held = open && j.status !== 'PENDING' && !!j.accBy;
  const mine = held && S.role === 'tech' && j.accBy === me().name;
  const asked   = !!j && S.role === 'eng' && j.reqBy === me().name;
  const pending = !!j && j.status === 'PENDING';
  return {
    edit:    mine,
    update:  mine,
    finish:  mine,
    release: held && (mine || sup),
    reassign: held && sup,
    editJob: (pending && asked) || (open && sup),
    cancel:  (pending && asked) || (open && sup)
  };
}

/* ---- progress ---- */
function progress(j){
  let req = 0, app = 0;
  if (j.de.sel)  { req += j.de.req;  app += j.de.app; }
  if (j.nde.sel) { req += j.nde.req; app += j.nde.app; }
  if (!req) return { pct:0, over:false, req:0, app:0 };
  const raw = app / req * 100;
  return { pct:Math.min(100, Math.round(raw)), over:raw > 100, req, app };
}

  j.nde.sel ? ['NDE', j.nde.req] : null
].filter(Boolean).map(([side, n]) =>
  `<span class="${cp}"><span class="${ct}">${side}:</span><span class="${cv}">${n}</span></span>`
).join('');

function deltaOf(j, key){
  const b = j[key];
  if (!j.sensor)                      return { why:'nosensor' };
  if (b.before === null || b.before === undefined) return { why:'miss' };
  if (b.aft === null || b.aft === undefined)       return { why:'wait' };
  if (b.retro || b.beforeRetro)       return { why:'retro' };
  const v = b.aft - b.before;
  return { v, band: v > CFG.dAlert ? 'alert' : v > CFG.dWarn ? 'warn' : 'ok' };
}
const deltaTxt = d => (d.v > 0 ? '+' : d.v < 0 ? '−' : '') + Math.abs(d.v).toFixed(1) + ' K';
const deltaWhy = d => t(d.why === 'nosensor' ? 'temp_nosensor_s'
  : d.why === 'wait' ? 'cd_no_wait' : d.why === 'retro' ? 'cd_no_retro' : 'cd_no_miss');

const md = m => MOTORDATA[m] || { rh:0, iv:0, next:0, on:false, rate:1, sensor:false, de:null, nde:null };
const remainOf = m => md(m).next - md(m).rh;
const daysOf   = m => Math.max(1, Math.ceil(Math.abs(remainOf(m)) / Math.max(1, md(m).rate)));
const motorState = m => remainOf(m) <= 0 ? 'over'
  : (remainOf(m) / Math.max(1, md(m).rate) <= CFG.upcoming) ? 'up' : 'ok';
const dueDate = m => { const d = new Date(2026, 7, 10);
  d.setDate(d.getDate() + daysOf(m));
  return d.toISOString().slice(0, 10); };
const allMotorsAll = () => AREAS.flatMap(a => (MOTORS[a] || []));
const allMotors = () => allMotorsAll().filter(m => md(m).act !== false);
const motorsIn = a => (MOTORS[a] || []).filter(m => md(m).act !== false);
const schedule  = st => allMotors().filter(m => motorState(m) === st)
  .sort((a, b) => remainOf(a) - remainOf(b));
const unaddressed = rows => rows.filter(m => !openOn(m)).length;
const closedOn = m => closedJobs().filter(j => j.motor === m)
  .sort((a, b) => dayOf(b.finAt) - dayOf(a.finAt));

const isMine = j => j.accBy === me().name || j.reqBy === me().name;
const myJobs = tab =>
    tab === 'pending' ? pendingJobs().filter(j => j.reqBy === me().name)
  : tab === 'closed'  ? closedJobs().filter(isMine)
  :                     activeJobs().filter(isMine);

const ptwSiblings = j => list(o => o.ptw === j.ptw && o.id !== j.id);

const matchQ = j => { const q = S.q.trim().toLowerCase(); return !q ||
  [j.id, j.motor, j.kks, j.ptw].some(v => String(v).toLowerCase().includes(q)); };
const dayOf = s => { const m = /(\d\d)-(\d\d)/.exec(s || ''); return m ? +m[1] * 100 + +m[2] : 0; };
const DATE_FLOOR = { '24h':809, '7d':803, '30d':711, all:0, custom:803 };
const dateKey = { '24h':'f_d24', '7d':'f_d7', '30d':'f_d30', all:'f_dall', custom:'f_dc' };
const defDate = () => (S.screen === 'closed' || S.screen === 'cancelled') ? '30d' : '7d';

const stampOf = (j, kind) =>
    kind === 'closed'    ? (j.finAt || j.reqAt)
  : kind === 'cancelled' ? (j.cancelled ? j.cancelled.at : j.reqAt)
  :                        j.reqAt;
const personOf = (j, kind) =>
    kind === 'cancelled' ? (j.cancelled ? j.cancelled.by : null)
  : (kind === 'active' || kind === 'closed') ? j.accBy
  : j.reqBy;

function applyFilt(rows, kind){
  const f = S.filt;
  return rows.filter(j =>
       matchQ(j)
    && (!f.areas.length || f.areas.includes(j.area))
    && (!f.by  || personOf(j, kind) === f.by)
    && (!f.req || j.reqBy === f.req)
    && (!f.rel     || j.released)
    && (!f.stalled || stalled(j))
    && (!f.over    || overApplied(j))
    && (f.cnr === null || (j.cancelled && j.cancelled.ri === f.cnr))
    && dayOf(stampOf(j, kind)) >= DATE_FLOOR[f.date]);
}
const matchM = m => { const q = S.q.trim().toLowerCase(); return !q ||
  [m, kks(m)].some(v => String(v).toLowerCase().includes(q)); };
function applyFiltM(rows){
  const f = S.filt;
  return rows.filter(m =>
       matchM(m)
    && (!f.areas.length || f.areas.includes(areaOf(m)))
    && (!f.mstate || motorState(m) === f.mstate)
    && (f.mon === null || md(m).on === f.mon)
    && (!f.noJob || !openOn(m)));
}
function filtCount(){
  const f = S.filt, keys = FILT_KEYS[filtKind()] || [];
  const on = k => keys.includes(k);
  return (on('areas') ? f.areas.length : 0)
       + (on('by')  && f.by  ? 1 : 0) + (on('req') && f.req ? 1 : 0)
       + (on('rel') && f.rel ? 1 : 0) + (on('stalled') && f.stalled ? 1 : 0)
       + (on('over') && f.over ? 1 : 0) + (on('cnr') && f.cnr !== null ? 1 : 0)
       + (on('mstate') && f.mstate ? 1 : 0) + (on('mon') && f.mon !== null ? 1 : 0)
       + (on('noJob') && f.noJob ? 1 : 0)
       + (on('date') && f.date !== defDate() ? 1 : 0)
       + (on('q') && S.q.trim() ? 1 : 0);
}
const clearFilt = () => { S.filt = { areas:[], by:null, req:null, date:defDate(),
  rel:false, stalled:false, over:false, cnr:null, mstate:null, mon:null, noJob:false };
  S.q = ''; };
const filtKind = () =>
    S.screen === 'stalled'   ? 'stalled'
  : S.screen === 'mdata'     ? 'mdata'
  : S.screen === 'users'     ? 'users'
  : S.screen === 'closed'    ? 'closed'

                             : S.mine === 'closed'   ? 'closed' : 'active')
  : S.screen === 'active'    ? 'active'

const filtBase = () =>
    S.screen === 'closed'    ? closedJobs()
  : S.screen === 'cancelled' ? cancelledJobs()
  : S.screen === 'mine'      ? myJobs(S.mine)
  : S.screen === 'active'    ? activeJobs()
  :                            pendingJobs();

  [...new Set(rows.map(j => personOf(j, kind)).filter(Boolean))];
const reqIn = rows => [...new Set(rows.map(j => j.reqBy).filter(Boolean))];

function filtChips(){
  const f = S.filt, out = [];
  const on = k => (FILT_KEYS[filtKind()] || []).includes(k);
  if (on('q') && S.q.trim())    out.push(['fx:q', S.q.trim()]);
  if (on('areas')) f.areas.forEach(a => out.push(['fx:area~' + a, a]));
  if (on('by')  && f.by)        out.push(['fx:by',      f.by]);
  if (on('req') && f.req)       out.push(['fx:req',     f.req]);
  if (on('date') && f.date !== defDate()) out.push(['fx:date', t(dateKey[f.date])]);
  if (on('rel')     && f.rel)     out.push(['fx:rel',     t('f_rel')]);
  if (on('stalled') && f.stalled) out.push(['fx:stalled', t('f_stalled')]);
  if (on('over')    && f.over)    out.push(['fx:over',    t('f_over')]);
  if (on('cnr')  && f.cnr !== null) out.push(['fx:cnr',   t('cn_reasons')[f.cnr]]);
  if (on('mstate') && f.mstate)   out.push(['fx:mstate',  t('mo_st_' + f.mstate)]);
  if (on('mon')  && f.mon !== null) out.push(['fx:mon',   t(f.mon ? 'mo_on' : 'mo_off')]);
  if (on('noJob') && f.noJob)     out.push(['fx:nojob',   t('f_nojob')]);
  if (!out.length) return '';
  return `<div class="filters">${out.map(([act, label]) =>
    `<button class="fchip" aria-pressed="true" data-act="${act}">${esc(label)}${
      ic('close',14)}</button>`).join('')}

  const canNew = S.role === 'eng' || S.role === 'sup';
  const group = (title, rows, cards, seg) => `<details class="coll" open>
    <summary>${ic('chev',18,'icon-dir')}${esc(title)}<span class="n">${rows.length}</span></summary>
    <div class="coll-b stack">
      ${rows.length ? cards : `<div class="jd-hint">${esc(t('m_none'))}</div>`}
      ${rows.length ? `<button class="btn btn-secondary" data-act="seg:${seg}">${
        esc(t('m_viewall', rows.length))}</button>` : ''}
    </div></details>`;
  return {
    bar: appbar(t('m_title'),'', { back:'home' }),
    tabs:'more',
    body:`${fresh()}<div class="pad">
      ${group(t('m_active'), act, act.slice(0,2).map(j => activeRow(j)).join(''), 'active')}
      ${group(t('m_pending'), pend, pend.slice(0,2).map(pendingRow(S.role === 'tech')).join(''), 'pending')}
      <div class="menu">
        ${canNew ? mrow(t('m_new'), { sub:t('m_new_s'), act:'new' }) : ''}
        ${mrow(t('m_mine'),  { act:'mine', cnt:mineCount() })}
        ${mrow(t('m_closed'),    { act:'closed',    cnt:closedJobs().length })}
        ${mrow(t('m_cancelled'), { act:'cancelled', cnt:cancelledJobs().length })}
        ${''}
        ${mrow(t('m_sched'), { act:'sched',
          cnt:t('m_overdue', unaddressed(schedule('over'))), hot:true })}
        ${mrow(t('m_motors'),    { act:'motors', cnt:allMotors().length })}
        ${S.queue.length ? mrow(t('m_sync'), { act:'sync', cnt:S.queue.length }) : ''}
      </div>
    </div>`
  };
}

function scMine(){
  const isEng = S.role === 'eng';
  if (!isEng && S.mine === 'pending') S.mine = 'active';
  const kind = filtKind();
  const rows = applyFilt(myJobs(S.mine), kind);
  const items = [['active', t('seg_active'), myJobs('active').length]];
  if (isEng) items.push(['pending', t('seg_pending'), myJobs('pending').length]);
  items.push(['closed', t('seg_closed'), myJobs('closed').length]);
  const cards = S.mine === 'pending' ? rows.map(pendingRow(false)).join('')
    : S.mine === 'closed'            ? rows.map(closedRow).join('')
    :                                  rows.map(j => activeRow(j, true)).join('');
  return {
    bar: appbar(t('my_title'),'', { back:'module',
      action:`<button class="ab-btn" data-act="filters" aria-label="${esc(t('filters'))}">${
        ic('filter',22)}</button>` }),
    tabs:'jobs',
    body:`${segbar(items, S.mine, 'mine')}${fresh()}
      <div class="pad tight wide">
        ${searchbar()}
        ${filtChips()}
        ${countline(rows.length, t('my_sort'))}
      </div>
      ${rows.length
        ? `<div class="cards wide">${cards}</div>`
        : `<div class="flush">${emptyList(t('my_empty_t'), t('my_empty_p'))}</div>`}
      ${rows.length ? pagerline() : ''}`
  };
}

function scEdit(){
  const j = job(), d = S.draft;
  const bad = [];
  if (!d.motor) bad.push(t('e_v_motor'));
  if (!d.de && !d.nde) bad.push(t('n_v_bearing'));
  if (d.de  && outReq(d.deAmt))  bad.push(t('n_v_de',  reqR()));
  if (d.nde && outReq(d.ndeAmt)) bad.push(t('n_v_nde', reqR()));
  const ok = !bad.length;
  return {
    bar: appbar(editTitle(j), j.id, { back:'back' }),
    body:`<div class="pad">
      <div class="note rule">${t('e_keep')}</div>
      ${S.role === 'sup' ? `<div class="note">${t('e_sup')}</div>` : ''}

      <label class="field"><span class="field-l">${esc(t('n_area'))}</span>
        <button class="field-c" data-act="dpkarea"><span class="grow">${esc(d.area)}</span>
          ${ic('down',18)}</button></label>

      <label class="field"><span class="field-l">${esc(t('e_motor'))}</span>
        <button class="field-c${d.motor ? '' : ' err'}" data-act="dpkmotor">
          <span class="grow${d.motor ? '' : ' ph'}">${esc(d.motor || t('e_motor_none'))}</span>
          ${d.motor ? `<span class="tech" style="color:var(--ink3);font-size:var(--fs-label)">${
            esc(kks(d.motor))}</span>` : ''}${ic('down',18)}</button>
        <span class="field-h${d.motor ? '' : ' e'}">${
          esc(d.motor ? t('e_motor_h') : t('e_v_motor'))}</span></label>

      <label class="field"><span class="field-l">${esc(t('n_grease'))}</span>
        <span class="field-c ro"><span class="grow">${esc(j.grease)}</span>${ic('lock',16)}</span>
        <span class="field-h">${esc(t('n_grease_h'))}</span></label>

      ${ptwField(d, 'dptw')}

      <div class="sect">${esc(t('n_sect_bearings'))}</div>
      <button class="chk" data-act="dtgl:de" aria-pressed="${d.de}">
        <span class="box">${ic('check',16)}</span><span class="grow">${esc(t('n_de'))}</span></button>
      ${d.de  ? amountBlock('de',  t('n_amt_de'),  d.deAmt,  'ddec','dinc','dtype') : ''}
      <button class="chk" data-act="dtgl:nde" aria-pressed="${d.nde}">
        <span class="box">${ic('check',16)}</span><span class="grow">${esc(t('n_nde'))}</span></button>
      ${d.nde ? amountBlock('nde', t('n_amt_nde'), d.ndeAmt, 'ddec','dinc','dtype') : ''}

      <label class="field"><span class="field-l">${esc(t('n_note'))}</span>
        <button class="field-c area" data-act="dnote">
          <span class="grow${tx(d.note) ? '' : ' ph'}">${
            esc(tx(d.note) || t('n_note_ph'))}</span></button></label>

      <div class="blocked">
        <button class="btn ${ok ? 'btn-primary' : 'btn-blocked'}" data-act="dsave">${
          esc(t('e_save'))}</button>
        ${bad.map(b => `<span class="blocked-why">${ic('alert',16)}${esc(b)}</span>`).join('')}
      </div>
    </div>`
  };
}

const amountBlock = (key, label, val, dec, inc, type) => `
  <div class="shots nest">
    <div class="shots-h"><span class="k">${esc(label)}</span>
      <span class="req">${esc(t('n_range', reqR()))}</span></div>
    <div class="shots-c" dir="ltr">
      <button data-act="${dec}:${key}" ${val <= CFG.reqMin ? 'disabled' : ''} aria-label="${esc(t('b_minus'))}">
        ${ic('minus',22)}<span class="step-k">−${CFG.step}</span></button>
      <button class="shots-v" data-act="${type}:${key}"><span class="n">${val}</span>
        <span class="u">shots · ≈${grams(val)} g</span></button>
      <button data-act="${inc}:${key}" ${val >= CFG.reqMax ? 'disabled' : ''} aria-label="${esc(t('b_plus'))}">
        ${ic('plus',22)}<span class="step-k">+${CFG.step}</span></button></div>
    <div class="shots-msg">${esc(t('n_amt_h'))}</div></div>`;

function ptwState(p){
  if (!PTW_MASK().test(p)) return { bad:true };
  const r = PTW_REG[p];
  if (r && r.expired) return { expired:true, to:r.to };
  return { ok:true, to:(r ? r.to : '2026-08-11 18:00') };
}
function ptwField(f, act){
  const st = ptwState(f.ptw);
  return `<label class="field"><span class="field-l">${esc(t('n_ptw'))}</span>
      <button class="field-c${st.ok ? '' : ' err'}" data-act="${act}">
        <span class="grow tech">${esc(f.ptw)}</span>
        ${st.ok ? `<span class="ok">${ic('check',18)}</span>` : ic('alert',18)}</button>
      ${st.bad ? `<span class="field-h e">${esc(t('n_ptw_bad'))}</span>` : ''}
      ${st.expired ? `<span class="field-h e">${esc(t('n_ptw_exp', st.to))}</span>` : ''}</label>
    ${st.ok ? `<label class="field"><span class="field-l">${esc(t('n_ptw_to'))}</span>
      <span class="field-c ro"><span class="grow tech">${esc(st.to)}</span></span></label>` : ''}`;
}

  ? `<span class="chip c-accepted">${esc(t('my_mine'))}</span>` : '';

      action:`<button class="ab-btn" data-act="filters" aria-label="${esc(t('filters'))}">${ic('filter',22)}</button>` }),

function activeRow(j, mine){
  const st = stalled(j);
  return `<button class="card ${st ? 's-overdue' : STATUS[j.status].lead}" data-act="open:${j.id}">
    <span class="card-b">
      <span class="hl"><span class="m">${esc(j.motor)}</span>
        <span class="u">${esc(j.area)}</span>
        <span class="id">${esc(j.id)}</span></span>
      <span class="flags">${statusChip(j.status)}${mine ? mineChip(j) : ''}${
        st ? `<span class="chip c-overdue">${esc(t('a_stalled'))}</span>` : ''}${
        overApplied(j) ? `<span class="chip c-upcoming">${esc(t('a_over_c'))}</span>` : ''}${
        syncBadge(j.sync)}</span>
      <span class="card-meta"><span class="tech">${esc(j.accBy)}</span>
        <span class="${st ? 'hot' : ''}">${esc(t('age'))} ${T(j.ageH)} ${
          esc(t('hUnit'))}</span></span>
      ${sides(j).map(k => {
        const b = j[k], over = b.app > b.req;
        const pct = b.req ? Math.min(100, Math.round(b.app / b.req * 100)) : 0;
        return `<span class="progs"><span class="k tech">${k.toUpperCase()}</span>
          <span class="t"><span class="f${over ? ' over' : ''}" style="width:${pct}%"></span></span>
          <span class="v tech">${b.app}/${b.req}</span></span>`;
      }).join('')}
    </span>
    <span class="lrow-go">${ic('chev',20,'icon-dir')}</span></button>`;
}

function scJob(){
  const j = job(), P = perms(j);
  const ns = nextStep(j, P);

  /* ---- gate evaluation, hard blocks first ---- */
  const gate = finishGate(j);

  return {
    bar: appbar(j.motor, `${j.id} · ${j.area}`, { back:'back' }),
    gate:`<div class="gate ${ns.cls}">${ic(ns.i,18)}
      <span>${ns.s} <span class="s">${esc(ns.n)}</span></span></div>`,
    body: j.status === 'PENDING'   ? jdDecision(j, P)
        : j.status === 'CLOSED'    ? jdClosed(j)
        : j.status === 'CANCELLED' ? jdCancelled(j)
        :                            jdWork(j, P),
    foot: jdActbar(j, P, gate)
  };
}

/* ---- the active screen — what is recorded, and with what ---- */
function jdWork(j, P){
  const queued = S.queue.some(q => q.jobId === j.id);
  return `<div class="pad">

    ${jdGrease(j)}

    ${queued ? `<div class="note"><b>${syncBadge('queued')}</b>
      ${t('j_queued', T(S.clock))}</div>` : ''}

    <div class="idline">${statusChip(j.status)}
      ${stalled(j) ? `<span class="chip c-overdue">${esc(t('a_stalled'))}</span>` : ''}
      <span class="age">${esc(t('age'))} ${T(j.ageH)} ${esc(t('hUnit'))}</span></div>

    ${jdHero(j)}

    <div class="sect">${esc(t('j_sect_apply'))}</div>
    ${jdPair(j, P)}
    <div class="jd-hint">${P.edit ? t('b_tap', T(appR())) : esc(t('b_ro'))}</div>

    <div class="sect">${esc(t('j_sect_notes'))}</div>
    ${jdNotes(j, P)}

    ${jdFold(j)}
  </div>`;
}

function jdDecision(j, P){
  const applied = appliedPairs(j);
  return `<div class="pad">
    ${jdGrease(j)}

    <div class="idline">${statusChip(j.status)}
      ${j.released ? `<span class="chip c-upcoming">${esc(t('p_released'))}</span>` : ''}
      ${syncBadge(j.sync)}
      <span class="age">${esc(t('age'))} ${T(j.ageH)} ${esc(t('hUnit'))}</span></div>

    <div class="reqhero"><span class="k">${esc(t('jd_take'))}</span>${reqPairs(j,'p','t','v')}</div>
    ${applied ? `<div class="note">${t('jd_earlier', T(applied))}</div>` : ''}

    <div class="nbox ro"><span class="k">${esc(t('jd_reqnote'))}</span>
      <span class="v${tx(j.reqNote) ? '' : ' ph'}">${esc(tx(j.reqNote) || t('none'))}</span></div>

    <div class="sect">${esc(t('j_sect_apply'))}</div>
    ${jdPair(j, P)}

    ${jdPtw(j)}

    ${j.relHist.length ? (r => `<div class="nbox ro"><span class="k">${esc(t('jd_why'))}</span>
      <span class="v">${esc(relReason(r))} — ${relActor(r)} <span class="tech">${
        esc(r.at)}</span></span></div>`)(j.relHist[j.relHist.length - 1]) : ''}

    ${jdFold(j)}
  </div>`;
}

function jdClosed(j){
  return `<div class="pad">
    <div class="note rule">${t('cd_terminal')}</div>
    ${jdGrease(j)}

    <div class="idline">${statusChip(j.status)}
      ${overApplied(j) ? `<span class="chip c-upcoming">${esc(t('a_over_c'))}</span>` : ''}
      ${syncBadge(j.sync)}
      <span class="age tech">${esc(j.finAt || '—')}</span></div>

    <div class="sect">${esc(t('cd_sect_applied'))}</div>
    <div>${sides(j).map(k => {
      const b = j[k], over = b.app > b.req;
      return `<div class="kv"><span class="k">${esc(t(k === 'de' ? 'cl_de' : 'cl_nde'))}</span>
        <span class="v"><span class="tech">${b.app} / ${b.req}</span> ${esc(t('jd_shots'))}${
          over ? `<small>${esc(t('cd_over_by', b.app - b.req))}</small>` : ''}</span></div>`;
    }).join('')}</div>

    ${''}
    ${sides(j).map(k => `<div class="sect">${esc(t('cd_sect_temp', k.toUpperCase()))}</div>
      ${tempFive(j, k)}`).join('')}
    <div class="note">${t('cd_abs')}</div>

    <div class="sect">${esc(t('j_sect_notes'))}</div>
    ${jdNotes(j, { edit:false })}

    <div class="sect">${esc(t('cd_sect_record'))}</div>
    ${jdRecord(j)}

    ${S.net !== 'online' && j.sync !== 'synced'
      ? `<div class="note"><b>${syncBadge(j.sync)}</b> ${t('cl_queued', T(S.clock))}</div>` : ''}
  </div>`;
}

function tempFive(j, key){
  const b = j[key], ns = { noSensor:!j.sensor };
  return `<div class="tempgrid">
    ${tempTile(t('cd_before'),    b.before, esc(t('cd_at_accept')), ns)}
    ${tempTile(t('cl_at_finish'), b.fin,    esc(t('cl_snap_finish')), ns)}
    ${tempTile(t('cl_settle'),    b.aft,
       esc(b.aft === null || b.aft === undefined ? t('cd_wait') : t('cl_settle_s')), ns)}
    ${deltaTile(j, key)}
    ${tempTile(t('cd_max'),       b.max,    esc(t('cd_max_s')), ns)}
  </div>`;
}

function deltaTile(j, key){
  const d = deltaOf(j, key);
  if (d.why === 'nosensor') return tempTile(t('cd_delta'), null, '', { noSensor:true });
  if (d.why)
    return `<div class="temp none"><span class="k">${esc(t('cd_delta'))}</span>
      <span class="v">—</span><span class="s">${esc(deltaWhy(d))}</span></div>`;
  const cls  = d.band === 'alert' ? ' d-alert' : d.band === 'warn' ? ' d-warn' : '';
  const word = d.band === 'alert' ? t('cd_band_alert') : d.band === 'warn' ? t('cd_band_warn') : '';
  const why  = d.band === 'alert' ? t('cd_band_alert_s')
             : d.band === 'warn'  ? t('cd_band_warn_s') : t('cd_band_ok_s');
  return `<div class="temp${cls}"><span class="k">${esc(t('cd_delta'))}</span>
    <span class="v tech">${esc(deltaTxt(d))}</span>
    ${''}
    <span class="s">${d.band === 'alert' ? ic('alert',13) : ''}${
      word ? `<span class="dband">${esc(word)}</span>` : ''}
      <span>${esc(why)} · ${esc(t('cd_delta_s'))}</span></span></div>`;
}

    <div class="note rule">${t('xd_kept')}</div>

    <div class="idline">${statusChip(j.status)}

      <div class="kv"><span class="k">${esc(t('xj_by'))}</span>
        <span class="v tech">${esc(c.by || '—')}</span></div>

    ${''}
    <div class="sect">${esc(t('cd_sect_applied'))}</div>
    <div>${sides(j).map(k => `<div class="kv"><span class="k">${
      esc(t(k === 'de' ? 'cl_de' : 'cl_nde'))}</span>
      <span class="v"><span class="tech">${j[k].app} / ${j[k].req}</span> ${

    <div class="sect">${esc(t('cd_sect_record'))}</div>

const cnReasonOf = c => c.ri !== undefined ? t('cn_reasons')[c.ri] : (tx(c.reason) || '—');

    ${j.finAt ? `<div class="kv"><span class="k">${esc(t('cd_finished'))}</span>
      <span class="v tech">${esc(j.finAt)}</span></div>` : ''}
    ${''}
    <div class="kv"><span class="k">${esc(t('cd_ptw'))}</span>

  ${ptwSiblings(j).length ? `<details class="coll"><summary>${ic('chev',18,'icon-dir')}
