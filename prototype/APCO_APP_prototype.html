    <div class="coll-b">${otherJobsOnPtw(j)}</div></details>` : ''}
  ${rel ? `<details class="coll"><summary>${ic('chev',18,'icon-dir')}

function nextStep(j, P){
  const p = progress(j);
  if (j.status === 'PENDING') return S.role === 'tech'
    ? { cls:'ro', i:'clock', s:esc(t('jd_ns_pending')), n:t('jd_ns_pending_s') }
    : { cls:'ro', i:'clock', s:esc(t('jd_ns_wait')),    n:t('jd_ns_wait_s') };
  if (j.status === 'CLOSED')
    return { cls:'ok', i:'check', s:esc(t('jd_ns_closed')), n:t('jd_ns_closed_s') };
  if (j.status === 'CANCELLED')
    return { cls:'ro', i:'ban',   s:esc(t('jd_ns_cancelled')), n:t('jd_ns_cancelled_s') };
  if (!P.edit)                return { cls:'ro',   i:'user',  s:esc(t('jd_ns_ro')),      n:t('jd_ns_ro_s') };
  if (j.ptwExpired)           return { cls:'blk',  i:'alert', s:esc(t('jd_ns_ptw')),     n:t('jd_ns_ptw_s') };
  if (overApplied(j))         return { cls:'warn', i:'warn',  s:esc(t('jd_ns_over')),    n:t('jd_ns_over_s') };
  if (p.app === 0)            return { cls:'blk',  i:'alert', s:esc(t('jd_ns_none')),    n:t('jd_ns_none_s') };
  if (shortSides(j).length)   return { cls:'',     i:'gun',   s:t('jd_ns_left', T(shortSides(j)
                                .map(k => `${k.toUpperCase()} ${j[k].req - j[k].app}`).join(' · '))),
                                n:t('jd_ns_left_s') };
  return { cls:'ok', i:'check', s:esc(t('jd_ns_ready')), n:t('jd_ns_ready_s') };
}

function jdActbar(j, P, gate){
  const secondary = P.editJob || P.release || P.reassign || P.cancel;
  const more = `<button class="btn ab-more" data-act="jmore" aria-label="${
    esc(t('jd_more_t'))}">${ic('more',20)}</button>`;
  const noact = `<div class="why q">${ic('user',16)}<span>${esc(t('ac_noact'))}</span></div>`;

  if (j.status === 'PENDING'){
    const canAccept = S.role === 'tech';
    if (!canAccept && !secondary) return `<div class="actbar">${noact}</div>`;
    const onBar = !canAccept && P.editJob;
    const rest  = P.release || P.reassign || P.cancel;
    return `<div class="actbar"><div class="row">
      ${canAccept ? `<button class="btn btn-primary" data-act="accept:${j.id}">${
        esc(t('p_accept'))}</button>` : ''}
      ${onBar ? `<button class="btn btn-primary" data-act="editjob">${
        esc(editTitle(j))}</button>` : ''}
      ${(onBar ? rest : secondary) ? (canAccept || onBar ? more
        : `<button class="btn btn-secondary" data-act="jmore">${esc(t('jd_more_t'))}</button>`) : ''}
    </div></div>`;
  }

  if (!P.update && !P.finish){
    if (!secondary) return `<div class="actbar">${noact}</div>`;
    const rest = P.release || P.reassign || P.cancel;
    return `<div class="actbar"><div class="row">
      ${P.editJob ? `<button class="btn btn-secondary" data-act="editjob">${
        esc(editTitle(j))}</button>` : ''}
      ${rest ? (P.editJob ? more
        : `<button class="btn btn-secondary" data-act="jmore">${esc(t('jd_more_t'))}</button>`) : ''}
    </div></div>`;
  }

  const hard = gate === 'ptw' || gate === 'accepted';
  return `<div class="actbar">
    ${hard ? `<div class="why">${ic('alert',16)}<span>${
      esc(gate === 'ptw' ? t('ac_blk_ptw') : t('ac_blk_acc'))}</span></div>` : ''}
    <div class="row">
      ${P.update ? `<button class="btn btn-primary" data-act="update">${esc(t('ac_update'))}</button>` : ''}
      ${P.finish ? `<button class="btn ${hard ? 'btn-blocked' : 'btn-secondary'}" data-act="finish"
        aria-label="${esc(t('ac_finish'))}">${esc(t('jd_finish_s'))}</button>` : ''}
      ${secondary ? more : ''}
    </div></div>`;
}

function finishGate(j){
  if (j.ptwExpired)             return 'ptw';
  if (j.status === 'ACCEPTED')  return 'accepted';
  if (overApplied(j))           return 'over';
  if (shortSides(j).length)     return 'under';
  return 'ok';
}


function newProblems(f){
  const bad = [];
  const st = ptwState(f.ptw);
  if (st.bad)     bad.push(t('n_ptw_bad'));
  if (st.expired) bad.push(t('n_ptw_exp', st.to));
  if (!f.de && !f.nde) bad.push(t('n_v_bearing'));
  if (f.de  && outReq(f.deAmt))  bad.push(t('n_v_de',  reqR()));
  if (f.nde && outReq(f.ndeAmt)) bad.push(t('n_v_nde', reqR()));
  if (!f.motors.length) bad.push(t('n_v_motor'));
  return bad;
}

function deltaLine(j){
  const parts = sides(j).map(k => {
    const d = deltaOf(j, k);
    return d.why ? null : `${k.toUpperCase()} ${deltaTxt(d)}`;
  }).filter(Boolean);
  const worst = sides(j).map(k => deltaOf(j, k)).filter(d => !d.why)
    .reduce((a, d) => d.band === 'alert' ? 'alert'
                    : (d.band === 'warn' && a !== 'alert') ? 'warn' : a, 'ok');
  if (!parts.length){
    const d = deltaOf(j, sides(j)[0] || 'de');
    return `<span class="card-meta"><span>${esc(t('cj_delta_k'))} —
      <span class="tech">${esc(d.why === 'wait' ? t('cj_delta_wait') : deltaWhy(d))}</span></span></span>`;
  }
  return `<span class="card-meta"><span class="${worst === 'ok' ? '' : 'hot'}">${
    esc(t('cj_delta_k'))} <span class="tech">${esc(parts.join(' · '))}</span>${
    worst === 'ok' ? '' : ` — ${esc(t(worst === 'alert' ? 'cd_band_alert' : 'cd_band_warn'))}`
    }</span></span>`;
}

function renameMotor(from, to){
  MOTORDATA[to] = MOTORDATA[from]; delete MOTORDATA[from];
  KKS[to] = KKS[from];             delete KKS[from];
  if (MGREASE[from] !== undefined){ MGREASE[to] = MGREASE[from]; delete MGREASE[from]; }
  AREAS.forEach(a => { const i = (MOTORS[a] || []).indexOf(from);
    if (i >= 0) MOTORS[a][i] = to; });
  Object.values(DB).forEach(j => { if (j.motor === from) j.motor = to; });
  if (S.motor === from) S.motor = to;
  S.form.motors = S.form.motors.map(m => m === from ? to : m);
  if (S.draft && S.draft.motor === from) S.draft.motor = to;
}
function renamePerson(from, to){
  Object.values(DB).forEach(j => {
    if (j.reqBy === from) j.reqBy = to;
    if (j.accBy === from) j.accBy = to;
    if (j.cancelled && j.cancelled.by === from) j.cancelled.by = to;
    (j.relHist  || []).forEach(e => { if (e.by === from) e.by = to;
                                      if (e.from === from) e.from = to; });
    (j.editHist || []).forEach(e => { if (e.by === from) e.by = to; });
  });
  if (S.newTech === from) S.newTech = to;
  S.alog.forEach(e => { if (e.who === from) e.who = to; });
}

  else if (PEOPLE.some(x => x.id === id && x.id !== d.key)) bad.push(t('um_id_dup'));

  if (!d.areas.length)                         bad.push(t('um_areas_none'));
  return bad;
}

const jobDepts = j => [j.to].concat(j.joined);
const canWork = j => j.status !== 'CLOSED' && jobDepts(j).includes(myDept());
const canJoin = j => j.status !== 'CLOSED' && j.status !== 'PENDING'
  && !jobDepts(j).includes(myDept());
const canAccept = j => j.status === 'PENDING' && j.to === myDept();

const evOf   = (j, k) => j.log.find(e => e.k === k) || null;
const hasEv  = (j, k) => !!evOf(j, k);
const updates = j => j.log.filter(e => e.k === 'upd' || e.k === 'join');
const updCount = j => j.log.filter(e => e.k === 'upd').length;

function atStep(j){
  if (!hasEv(j,'acc'))   return 0;
  if (hasEv(j,'done'))   return PATH.length;
  if (hasEv(j,'test'))   return 4;
  if (hasEv(j,'start'))  return 3;
  return 2;
}
const trackStalled = j => (j.status === 'ACCEPTED' || j.status === 'IN_PROGRESS')
  && (j.updH === undefined ? j.ageH : j.updH) > CFG.stalledH;

/* ---- the path, drawn (2.49 · 2.50) ---- */
const stepState = (j, i) => {
  if (hasEv(j, 'done')) return 'done';
  const n = atStep(j);
  return i < n - 1 ? 'done' : i === n - 1 ? 'now' : 'next';
};

function trkPath(j){
  return `<div class="trk">${PATH.map((p, i) => {
    const st = stepState(j, i);
    return `<div class="trk-s ${st}">
      <span class="trk-node">${st === 'done' ? ic('check',14,'',2.6) : ic(p.i,14)}</span>
      <div class="trk-b">
        <div class="trk-t">${esc(stepName(p.k))}${
          p.k === 'work' && updCount(j)
            ? `<span class="chip c-progress">${esc(t('c_upd', updCount(j)))}</span>` : ''}</div>
        ${p.k === 'work' ? trkWork(j, st) : trkStop(j, p)}
      </div></div>`;
  }).join('')}</div>`;
}

function trkStop(j, p){
  const ev = evOf(j, p.k);
  if (!ev) return `<div class="hint">${esc(stepHint(p.k))}</div>`;
  return `${evMeta(ev)}${ev.note ? evNote(ev) : ''}${evPhotos(ev)}`;
}

const evMeta = ev => `<div class="trk-m">${deptTag(ev.dept)}
  ${ev.by && ev.by !== '—' ? `<span class="by">${esc(ev.by)}</span>` : ''}
  <span class="at">${esc(ev.at)}</span></div>`;

const evNote = ev => `<div class="nbox${ev.dept === myDept() ? ' own' : ''}">
  <span class="v">${esc(tx(ev.note))}</span></div>`;

const evPhotos = ev => ev.photos
  ? `<div class="photos sm">${Array.from({length:ev.photos}, () =>
      `<span class="photo">${ic('cam',16)}</span>`).join('')}</div>` : '';

function trkWork(j, st){
  if (st === 'next') return `<div class="hint">${esc(stepHint('work'))}</div>`;
  const evs = updates(j);
  if (!evs.length) return `<div class="trk-none">${esc(t('trk_no_upd'))}</div>
    <div class="hint">${esc(stepHint('work'))}</div>`;
  return `<div class="trk-u">${evs.map(ev => ev.k === 'join'
    ? `<div class="trk-m">${ic('join',14)}${deptTag(ev.dept)}
        <span>${esc(t('jd_joined'))}</span><span class="at">${esc(ev.at)}</span></div>`
    : `<div class="nbox${ev.dept === myDept() ? ' own' : ''}">
        <div class="trk-uh"><span class="k">${esc(t('trk_upd_k'))}</span>
          ${deptTag(ev.dept)}<span class="at">${esc(ev.at)}</span></div>
        <span class="v">${esc(tx(ev.note))}</span>
        ${ev.photos ? `<div class="photos sm">${Array.from({length:ev.photos}, () =>
          `<span class="photo">${ic('cam',16)}</span>`).join('')}</div>` : ''}
      </div>`).join('')}</div>`;
}

function scTrackJob(){
  const j = trackJob();
  const ns = trackNextStep(j);
  return {
    bar: appbar(j.equip, `${j.id} · ${j.area}`, { back:'back' }),
    gate:`<div class="gate ${ns.cls}">${ic(ns.i,18)}
      <span>${esc(ns.s)} <span class="s">${esc(ns.n)}</span></span></div>`,
    body: j.status === 'PENDING' ? jdPending(j) : jdActive(j),
    foot: trkActbar(j)
  };
}

function trackNextStep(j){
  if (j.status === 'PENDING')
    return canAccept(j)
      ? { cls:'',   i:'check', s:t('ns_accept'), n:t('ns_accept_s') }
      : { cls:'ro', i:'clock', s:t('ns_wait', dShort(j.to)), n:t('ns_wait_s') };
  if (j.status === 'CLOSED')
    return { cls:'ok', i:'flag', s:stepName('done'), n:stepHint('done') };
  if (!canWork(j))            return { cls:'ro',  i:'user',  s:t('ns_ro', dShort(j.to)), n:t('ns_ro_s') };
  if (trackStalled(j))        return { cls:'blk', i:'alert', s:t('ns_stalled'), n:t('ns_stalled_s') };
  if (!hasEv(j,'start'))      return { cls:'',    i:'play',  s:t('ns_start'), n:t('ns_start_s') };
  if (!updCount(j))           return { cls:'',    i:'edit',  s:t('ns_first'), n:t('ns_first_s') };
  if (!hasEv(j,'test'))       return { cls:'',    i:'wrench',s:t('ns_upd', j.updH), n:t('ns_upd_s') };
  return { cls:'ok', i:'flag', s:t('ns_fin'), n:t('ns_fin_s') };
}

function guideStamp(){
  let [h, m] = S.clock.split(':').map(Number);
  m += 1; if (m > 59){ m = 0; h = (h + 1) % 24; }
  S.clock = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  return S.clock;
}

  return `<div><div class="blk-k">${esc(t('gpr_k'))}</div>

function msgAi(m){
  const a = m.a, last = m.last;
  const body = [];

  body.push(groundLine(a));
  if (a.safe) body.push(`<div class="safe">${ic('alert',18)}
    <span class="b"><span>${esc(tx(a.safe))}</span>${
      a.safeCite ? citeChip(a.safeCite) : ''}</span></div>`);
  if (a.lead) body.push(`<p>${esc(tx(a.lead))}</p>`);
  if (a.hard) body.push(`<div class="safe warn">${ic('warn',18)}<span>${esc(tx(a.hard))}</span></div>`);
  if (a.causes) body.push(causeList(a.causes));
  if (a.proc)   body.push(procList(a.proc, !last));

  if (a.handoff) body.push(`<div class="handoff">
    <span class="k">${ic('wrench',16)}${esc(t('ho_k'))}</span>
    <span class="d">${esc(t('ho_d'))}</span>

  return `<div class="msg ai">

function guideSend(txt, answer){
  S.guide.thread.push({ who:'you', txt, at:guideStamp() });
  S.guide.busy = true; S.guide.stick = true;
  render();
  clearTimeout(guideSend._t);
  guideSend._t = setTimeout(() => {
    S.guide.busy = false;
    S.guide.thread.push({ who:'ai', a:answer, at:guideStamp() });
    S.guide.stick = true;
    render();
  }, 900);
}

let ixTimer = null;
function startIx(){
  if (ixTimer) return;
  ixTimer = setInterval(() => {
    const run = DOCS.filter(d => d.st === 'ix');
    if (!run.length){ clearInterval(ixTimer); ixTimer = null; return; }
    let done = 0;
    run.forEach(d => {
      d.pct = Math.min(100, (d.pct || 0) + 11);
      if (d.pct >= 100){
        d.st = 'live'; d.pass = d.pages * 8; d.at = '2026-08-12'; done++;
      }
    });
    render();
    if (done) toast(esc(t('ts_ixdone', done)));
  }, 420);
}

  if (!S.overlay) return '';
  const j = job();
  switch (S.overlay){

    /* ---- Finish gate 1/2 — hard blocks ---- */
    case 'g-accepted': return dialog(true, t('o_acc_t'), t('o_acc_p'),
      `<button class="btn btn-primary" data-act="close">${esc(t('o_back_job'))}</button>`);

    case 'g-ptw': return dialog(true, t('o_ptw_t'),
      t('o_ptw_p', T(j.ptw), T(j.ptwTo)),
      `<button class="btn btn-primary" data-act="close">${esc(t('o_back_job'))}</button>`);

    /* ---- Finish gate 3 — under-applied ---- */
    case 'g-under': {
      const amt = sides(j).map(k =>
        t('o_under_de', T(k.toUpperCase() + ' ' + j[k].app), T(j[k].req))).join(' · ');
      return dialog(false, t('o_under_t'),
        t('o_under_p', amt),
        `<button class="btn btn-secondary" data-act="close">${esc(t('o_continue'))}</button>
         <button class="btn btn-primary" data-act="do-finish">${esc(t('o_finish_anyway'))}</button>`);
    }

    /* ---- Finish gate 4 — over-applied, reason required ---- */
    case 'g-over': {
      const dOver = j.de.sel  && j.de.app  > j.de.req;
      const nOver = j.nde.sel && j.nde.app > j.nde.req;
      const has = S.finishReason.trim().length > 0;
      const amt = (dOver ? T('DE ' + j.de.app + '/' + j.de.req) : '') +
        (dOver && nOver ? ' · ' : '') +
        (nOver ? T('NDE ' + j.nde.app + '/' + j.nde.req) : '');
      return `<div class="ovl center"><div class="dialog stop">
        <div class="dialog-b">
          <h4>${esc(t('o_over_t'))}</h4>
          <p>${t('o_over_p', amt)}</p>
          <div class="field" style="margin-top:var(--s-3)">
            <span class="field-l">${esc(t('o_reason_l'))}</span>
            <button class="field-c area ${has ? '' : 'err'}" data-act="reason">
              <span class="grow${has ? '' : ' ph'}">${
                esc(S.finishReason || t('o_reason_ph'))}</span></button></div>
        </div>
        <div class="sheetc-f">
          <button class="btn btn-secondary" data-act="close">${esc(t('back'))}</button>
          <button class="btn ${has ? 'btn-destructive' : 'btn-blocked'}" data-act="do-finish">${
            esc(t('o_confirm'))}</button>
        </div></div></div>`;
    }

    /* ---- Release ---- */
    case 'release': {
      const other = S.relReason === OTHER_REASON;
      const ok = S.relReason !== null && (!other || S.relComment.trim());
      const kept = `${sides(j).map(k => T(k.toUpperCase() + ' ' + j[k].app)).join(' · ')} shots${
        j.photos ? t('rl_photos', j.photos) : ''}`;
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${
          esc(j.accBy === me().name ? t('rl_title') : t('rl_force'))}</b>
          <span class="tech" style="color:var(--ink3);font-size:var(--fs-label)">${esc(j.id)}</span></div>
        <div class="sheetc-b">
          <div class="field-h">${esc(t('rl_h'))}</div>
          <div class="field"><span class="field-l">${esc(t('rl_reason_l'))}</span>
            <div class="radios" role="radiogroup">${relReasons().map((r,i) => `
              <button role="radio" data-act="rr:${i}" aria-checked="${S.relReason === i}">
                <span class="dot"></span><span>${esc(r)}</span></button>`).join('')}
            </div></div>
          ${other ? `<div class="field"><span class="field-l">${esc(t('rl_comment_l'))}</span>
            <button class="field-c area ${S.relComment.trim() ? '' : 'err'}" data-act="relcom">
              <span class="grow${S.relComment.trim() ? '' : ' ph'}">${
                esc(S.relComment || t('rl_comment_ph'))}</span></button></div>` : ''}
          <div class="note">${t('rl_keep', kept)}</div>
        </div>
        <div class="sheetc-f">
          <button class="btn btn-secondary" data-act="close">${esc(t('rl_keepbtn'))}</button>
          <button class="btn ${ok ? 'btn-destructive' : 'btn-blocked'}" data-act="do-release">${
            esc(t('rl_confirm'))}</button>
        </div></div></div>`;
    }

    /* ---- Reassign ---- */
    case 'reassign': {
      const ok = S.reassignReason.trim().length > 0;
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('ra_title'))}</b>
          <span class="tech" style="color:var(--ink3);font-size:var(--fs-label)">${esc(j.id)}</span></div>
        <div class="sheetc-b">
          <div class="field-h">${t('ra_cur', T(j.id), esc(j.motor), T(j.accBy || '—'))}</div>
          <div class="field"><span class="field-l">${esc(t('ra_new'))}</span>
            <button class="field-c${S.newTech ? '' : ' err'}" data-act="nexttech">
              <span class="grow${S.newTech ? ' tech' : ' ph'}">${esc(S.newTech || '—')}</span>
              ${ic('down',18)}</button>
            <span class="field-h${S.newTech ? '' : ' e'}">${
              S.newTech ? esc(t('ra_scope', j.area)) : esc(t('ra_none'))}</span></div>
          <div class="field"><span class="field-l">${esc(t('ra_reason'))}</span>
            <button class="field-c area ${ok ? '' : 'err'}" data-act="racom">
              <span class="grow${ok ? '' : ' ph'}">${
                esc(S.reassignReason || t('rl_comment_ph'))}</span></button></div>
          <div class="note">${t('ra_note', T(j.status))}</div>
        </div>
        <div class="sheetc-f">
          <button class="btn btn-secondary" data-act="close">${esc(t('ra_undo'))}</button>
          <button class="btn ${ok && S.newTech ? 'btn-primary' : 'btn-blocked'}" data-act="do-reassign">${
            esc(t('ra_do'))}</button>
        </div></div></div>`;
    }

    case 'cancel': {
      const other = S.cnReason === CN_OTHER;
      const ok = S.cnReason !== null && (!other || S.cnComment.trim());
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('cn_title'))}</b></div>
        <div class="sheetc-b">
          <div class="kv"><span class="k">${esc(t('jd_id'))}</span>
            <span class="v tech">${esc(j.id)} · ${esc(j.motor)}</span></div>

          <div class="field"><span class="field-l">${esc(t('cn_reason_l'))}</span>
            <div class="radios" role="radiogroup">${t('cn_reasons').map((r, i) =>
              `<button role="radio" aria-checked="${S.cnReason === i}" data-act="cnr:${i}">
                <span class="dot"></span><span>${esc(r)}</span></button>`).join('')}</div></div>

          ${other ? `<div class="field"><span class="field-l">${esc(t('cn_comment_l'))}</span>
            <button class="field-c area ${S.cnComment.trim() ? '' : 'err'}" data-act="cncom">
              <span class="grow${S.cnComment.trim() ? '' : ' ph'}">${
                esc(S.cnComment || t('rl_comment_ph'))}</span></button></div>` : ''}

          <div class="note rule">${t('cn_keep')}</div>
        </div>
        <div class="sheetc-f">
          <button class="btn btn-secondary" data-act="close">${esc(t('cn_keepbtn'))}</button>
          <button class="btn ${ok ? 'btn-destructive' : 'btn-blocked'}" data-act="do-cancel">${
            esc(t('cn_do'))}</button>
        </div></div></div>`;
    }

    /* ---- Profile — the account, not the work ---- */
    case 'profile': {
      const u = me();
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('h_profile'))}</b></div>
        <div class="sheetc-b">
          <div class="who"><span class="av">${esc(initials(u.name))}</span>
            <span class="grow"><span class="n">${esc(u.name)}</span>
              <span class="r">${esc(roleLabel())} · ${esc(u.id)}</span></span></div>
          ${''}
          <div class="kv"><span class="k">${esc(t('pf_areas'))}</span>
            <span class="v">${areasTxt(u.areas)}<small>${esc(t('pf_areas_s'))}</small></span></div>
          <div class="menu">
            ${mrow(t('pf_me'),    { sub:t('pf_me_s'),    act:'soon:profile' })}
            ${mrow(t('pf_pin'),   { act:'soon:pin' })}
            ${mrow(t('pf_lang'),  { sub:LANGNAME[S.lang], act:'swaplang' })}
            ${mrow(t('pf_help'),  { act:'soon:help' })}
            ${mrow(t('pf_out'),   { act:'signout', dan:true, icon:'out', dir:true })}
          </div>
          <div class="field-h tech">${esc(t('pf_v'))}</div>
        </div>
        <div class="sheetc-f"><button class="btn btn-secondary" data-act="close">${
          esc(t('close'))}</button></div>
      </div></div>`;
    }

    case 'filters': {
      const kind = filtKind();
      const pill = (label, on, act) =>
        `<button class="fchip" aria-pressed="${on}" data-act="${act}">${esc(label)}</button>`;
      const chk = (label, on, act) =>
        `<button class="chk" data-act="${act}" aria-pressed="${on}">
          <span class="box">${ic('check',16)}</span>
          <span class="grow">${esc(label)}</span></button>`;
      const onMotors = kind === 'motors' || kind === 'sched';
      const base = onMotors ? null : filtBase();
      const n = onMotors
        ? applyFiltM(kind === 'sched' ? schedule(S.sched) : allMotors()).length
        : applyFilt(base, kind).length;

      const areaRow = `<div class="field"><span class="field-l">${esc(t('f_area'))}</span>
        <div class="filters">${AREAS.map(a =>
          pill(a, S.filt.areas.includes(a), 'farea:' + a)).join('')}</div></div>`;

      const personRow = (label, act, val, people) =>
        `<div class="field"><span class="field-l">${esc(label)}</span>
          <button class="field-c" data-act="${act}"><span class="grow${val ? ' tech' : ''}">${
            esc(val || t('f_any'))}</span>${ic('down',18)}</button>
          <span class="field-h tech">${esc(people.join(' · ') || '—')}</span></div>`;

      const dateRow = ranges => `<div class="field"><span class="field-l">${
        esc(kind === 'closed' || kind === 'cancelled' ? t('f_range') : t('f_date'))}</span>
        <div class="filters">${ranges.map(d =>
          pill(t(dateKey[d]), S.filt.date === d, 'fdate:' + d)).join('')}</div></div>
        ${S.filt.date === 'custom' ? `<div class="btnrow">
          <label class="field"><span class="field-l">${esc(t('f_from'))}</span>
            <span class="field-c ro"><span class="grow tech">2026-08-03</span></span></label>
          <label class="field"><span class="field-l">${esc(t('f_to'))}</span>
            <span class="field-c ro"><span class="grow tech">2026-08-10</span></span></label>
        </div>` : ''}`;

      let rows;
      if (kind === 'closed'){
        rows = areaRow
          + personRow(t('f_by_acc'), 'fby',  S.filt.by,  peopleIn(base, kind))
          + personRow(t('f_by_req'), 'freq', S.filt.req, reqIn(base))
          + dateRow(['24h','7d','30d','all','custom'])
          + chk(t('f_over'), S.filt.over, 'fover');
      } else if (kind === 'cancelled'){
        rows = areaRow
          + `<div class="field"><span class="field-l">${esc(t('f_cnr'))}</span>
              <div class="filters">${t('cn_reasons').map((r, i) =>
                pill(r, S.filt.cnr === i, 'fcnr:' + i)).join('')}</div></div>`
          + personRow(t('f_by_cn'), 'fby', S.filt.by, peopleIn(base, kind))
          + dateRow(['24h','7d','30d','all','custom']);
      } else if (onMotors){
        rows = areaRow
          + `<div class="field"><span class="field-l">${esc(t('f_mon'))}</span>
              <div class="filters">${pill(t('mo_on'), S.filt.mon === true, 'fmon:on')}${
                pill(t('mo_off'), S.filt.mon === false, 'fmon:off')}</div></div>`
          + (kind === 'motors'
            ? `<div class="field"><span class="field-l">${esc(t('f_mstate'))}</span>
                <div class="filters">${['over','up','ok'].map(s =>
                  pill(t('mo_st_' + s), S.filt.mstate === s, 'fmstate:' + s)).join('')}</div></div>`
            : chk(t('f_nojob'), S.filt.noJob, 'fnojob'));
      } else {
        rows = areaRow
          + personRow(kind === 'active' ? t('f_by_acc') : t('f_by_req'),
              'fby', S.filt.by, peopleIn(base, kind))
          + dateRow(['24h','7d','30d','custom'])
          + (kind === 'active' ? chk(t('f_stalled'), S.filt.stalled, 'fstalled')
                               : chk(t('f_rel'), S.filt.rel, 'frel'));
      }

      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('f_title'))}</b>
          <button class="btn btn-sm btn-secondary" data-act="fclear">${esc(t('f_clear'))}</button></div>
        <div class="sheetc-b">${rows}</div>
        <div class="sheetc-f">
          <button class="btn ${n ? 'btn-primary' : 'btn-blocked'}" data-act="close">${
            esc(n ? t('f_show', n) : t('f_show0'))}</button></div>
      </div></div>`;
    }

    case 'pkarea': case 'dpkarea': {
      const k = pkOn();
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('n_pk_area_t'))}</b></div>
        <div class="sheetc-b">
          <div class="radios" role="radiogroup">${AREAS.map(a => `
            <button role="radio" aria-checked="${k.area === a}" data-act="${k.p}pka:${a}">
              <span class="dot"></span><span class="tech">${esc(a)}</span>
              <span class="tech n">${
                esc(t('n_pk_area_n', motorsIn(a).length))}</span></button>`).join('')}
          </div>
          <div class="field-h">${esc(t(k.one ? 'e_pk_area_h' : 'n_pk_area_h'))}</div>
        </div>
        <div class="sheetc-f"><button class="btn btn-secondary" data-act="close">${
          esc(t('close'))}</button></div>
      </div></div>`;
    }

    case 'pkmotor': case 'dpkmotor': {
      const k = pkOn();
      const roster = motorsIn(k.area);
      const row = m => k.one
        ? `<button role="radio" aria-checked="${k.has(m)}" data-act="dpkm:${m}">
             <span class="dot"></span><span class="tech">${esc(m)}</span>
             <span class="tech n">${
               esc(kks(m))}</span></button>`
        : `<button class="chk" data-act="pkm:${m}" aria-pressed="${k.has(m)}">
             <span class="box">${ic('check',16)}</span>
             <span class="grow tech">${esc(m)}</span>
             <span class="hint">${esc(kks(m))}</span></button>`;
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('n_pk_motor_t', k.area))}</b>
          <button class="btn btn-sm btn-secondary" data-act="${k.p}pkarea">${
            esc(t('n_pk_area_t'))}</button></div>
        <div class="sheetc-b">
          ${!roster.length ? `<div class="note">${esc(t('n_pk_empty'))}</div>`
            : k.one ? `<div class="radios" role="radiogroup">${roster.map(row).join('')}</div>`
                    : roster.map(row).join('')}
          <div class="field-h">${esc(t(k.one ? 'e_pk_motor_h' : 'n_pk_motor_h'))}</div>
        </div>
        <div class="sheetc-f">
          <button class="btn ${k.n ? 'btn-primary' : 'btn-blocked'}" data-act="close">${
            esc(k.n ? t('n_pk_done', k.n) : t(k.one ? 'e_v_motor' : 'n_pk_done0'))}</button></div>
      </div></div>`;
    }

    case 'dup': {
      const o = S.dup;
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('n_dup_t'))}</b></div>
        <div class="sheetc-b">
          ${t('n_dup_p', esc(o.motor))}
          <div class="cards">${o.status === 'PENDING' ? pendingRow(false)(o) : activeRow(o)}</div>
        </div>
        <div class="sheetc-f">
          <button class="btn btn-secondary" data-act="close">${esc(t('back'))}</button>
          <button class="btn btn-primary" data-act="do-create">${esc(t('n_dup_go'))}</button>
        </div></div></div>`;
    }

    case 'pick': {
      const k = S.pick;
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t(k.title))}</b></div>
        <div class="sheetc-b">
          <div class="radios" role="radiogroup">${k.items.map(([v, label, sub]) => `
            <button role="radio" aria-checked="${k.cur === v}" data-act="pk1:${v}">
              <span class="dot"></span><span${k.mono ? ' class="tech"' : ''}>${esc(label)}</span>
              ${sub ? `<span class="tech n">${
                esc(sub)}</span>` : ''}</button>`).join('')}</div>
          ${k.hint ? `<div class="field-h">${t(k.hint)}</div>` : ''}
        </div>
        <div class="sheetc-f"><button class="btn btn-secondary" data-act="close">${
          esc(t('close'))}</button></div>
      </div></div>`;
    }

    case 'mmdeact': return dialog(false, t('mm_deact_t'), t('mm_deact_p', esc(S.mdraft.name)),
      `<button class="btn btn-secondary" data-act="close">${esc(t('back'))}</button>
       <button class="btn btn-destructive" data-act="do-mmdeact">${esc(t('mm_deact_do'))}</button>`);
    case 'mmreact': return dialog(false, t('mm_react_t'), t('mm_react_p', esc(S.mdraft.name)),
      `<button class="btn btn-secondary" data-act="close">${esc(t('back'))}</button>
       <button class="btn btn-primary" data-act="do-mmreact">${esc(t('mm_react_do'))}</button>`);
    case 'umdeact': return dialog(false, t('um_deact_t'), t('um_deact_p', esc(S.udraft.name)),
      `<button class="btn btn-secondary" data-act="close">${esc(t('back'))}</button>
       <button class="btn btn-destructive" data-act="do-umdeact">${esc(t('um_deact_do'))}</button>`);
    case 'umreact': return dialog(false, t('um_react_t'), t('um_react_p', esc(S.udraft.name)),
      `<button class="btn btn-secondary" data-act="close">${esc(t('back'))}</button>
       <button class="btn btn-primary" data-act="do-umreact">${esc(t('um_react_do'))}</button>`);
    case 'umpin': return dialog(false, t('um_pin_t'), t('um_pin_p', esc(S.udraft.name)),
      `<button class="btn btn-secondary" data-act="close">${esc(t('back'))}</button>
       <button class="btn btn-primary" data-act="do-umpin">${esc(t('um_pin_do'))}</button>`);

    /* ---- what this prototype does not build ---- */
    case 'soon': return dialog(false, t('so_t', S.soon.name),
      t('so_p', T(S.soon.ref), esc(S.soon.wave)),
      `<button class="btn btn-primary" data-act="close">${esc(t('so_ok'))}</button>`);

    /* ---- job tracking — the update sheet, and the two confirmations ---- */
    case 'tupdate': {
      const j = trackJob();
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('u_title'))}</b></div>
        <div class="sheetc-b">
          <p class="jd-hint">${esc(t('u_h'))}</p>
          <label class="field">
            <span class="field-l">${esc(t('u_note_l'))}</span>
            <button class="field-c" data-act="tunote">
              <span class="grow${S.track.upd.note ? '' : ' ph'}">${
                esc(S.track.upd.note || t('u_note_ph'))}</span></button>
            ${S.track.upd.err ? `<span class="field-h e">${esc(t('u_need'))}</span>` : ''}
          </label>
          <div class="field">
            <span class="field-l">${esc(t('u_photos_l'))}</span>
            <div class="photos sm">${Array.from({length:S.track.upd.photos}, () =>
              `<span class="photo">${ic('cam',18)}</span>`).join('')}
              <button class="photo add" data-act="tuphoto">${ic('plus',18)}</button></div>
          </div>
          ${S.net !== 'online' ? `<div class="note">${esc(t('u_off'))}</div>` : ''}
        </div>
        <div class="sheetc-f">
          <button class="btn btn-secondary" data-act="close">${esc(t('u_cancel'))}</button>
          <button class="btn btn-primary" data-act="tdo-update">${esc(t('u_send'))}</button>
        </div></div></div>`;
    }
    case 'tfinish': return dialog(true, t('o_fin_t'),
      `<p>${esc(t('o_fin_p', trackJob().log.length))}</p>`,
      `<button class="btn btn-secondary" data-act="close">${esc(t('o_back'))}</button>
       <button class="btn btn-primary" data-act="tdo-finish">${esc(t('o_fin_do'))}</button>`);
    case 'tjoin': return dialog(false, t('o_join_t'),
      `<p>${esc(t('o_join_p', dShort(trackJob().to)))}</p>`,
      `<button class="btn btn-secondary" data-act="close">${esc(t('o_back'))}</button>
       <button class="btn btn-primary" data-act="tdo-join">${esc(t('o_join_do'))}</button>`);

    /* ---- troubleshooting guide — the source sheet, and two confirmations ---- */
    case 'gsrc': {
      const c = CITE[S.guide.src], d = gdoc(c.doc);
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('src_t'))}</b>
          <span class="tech" style="color:var(--ink3);font-size:var(--fs-label)">${
            esc(d ? d.code : '—')} ${esc(c.sec)}</span></div>
        <div class="sheetc-b">
          <div>${kv(t('ci_k'), esc(d ? tx(d.n) : '—'))}
            ${kv(t('ix_stat_last'), esc(d ? d.rev + ' · ' + d.at : '—'), true)}
            ${kv(t('src_t'), esc(c.sec + ' · ' + t('ci_page', c.page)), true)}</div>
          <div class="pass"><span class="m"><span>${esc(d ? d.code : '')}</span>
            <span>${esc(c.sec)}</span><span>${esc(t('ci_page', c.page))}</span></span>
            <span class="v" dir="auto">${esc(tx(c.txt))}</span></div>
          <div class="jd-hint">${esc(t('src_note'))}</div>
        </div>
        <div class="sheetc-f">
          <button class="btn btn-secondary" data-act="close">${esc(t('close'))}</button>
          <button class="btn btn-secondary" data-act="soon:gdoc">${esc(t('src_open'))}</button>
        </div></div></div>`;
    }
    case 'gnewchat':
      return dialog(false, t('sc_new_t'), `<p>${esc(t('sc_new_p'))}</p>`,
        `<button class="btn btn-secondary" data-act="close">${esc(t('cancel'))}</button>
         <button class="btn btn-primary" data-act="gdo-new">${esc(t('sc_new_do'))}</button>`);
    case 'gdel': {
      const d = gdoc(S.guide.del);
      return dialog(true, t('ix_del_t'), `<p>${esc(t('ix_del_p', tx(d.n)))}</p>`,
        `<button class="btn btn-secondary" data-act="close">${esc(t('cancel'))}</button>
         <button class="btn btn-destructive" data-act="gdo-del">${esc(t('ix_del_do'))}</button>`);
    }

    case 'jmore': {
      const P = perms(j);
      const b = (act, cls, label) =>
        `<button class="btn ${cls}" data-act="${act}">${esc(label)}</button>`;
      return `<div class="ovl bottom"><div class="sheetc">
        <div class="grab"></div>
        <div class="sheetc-h"><b>${esc(t('jd_more_t'))}</b>
          <span class="tech" style="color:var(--ink3);font-size:var(--fs-label)">${esc(j.id)}</span></div>
        <div class="sheetc-b">
          ${P.release ? b('release','btn-destructive',
            j.accBy === me().name ? t('ac_release') : t('ac_force')) : ''}
          ${P.reassign ? b('reassign','btn-secondary', t('ac_reassign')) : ''}
          ${P.cancel ? b('cancel','btn-destructive', t('ac_cancel')) : ''}
        </div>
        <div class="sheetc-f"><button class="btn btn-secondary" data-act="close">${
          esc(t('close'))}</button></div>
      </div></div>`;
    }

    /* ---- provisional accept, offline ---- */
    case 'prov': return dialog(false, t('pv_title'), t('pv_p'),
      `<button class="btn btn-primary" data-act="close">${esc(t('pv_ok'))}</button>`);
  }
  return '';
}

function dialog(stop, title, bodyHtml, footHtml){
  return `<div class="ovl center"><div class="dialog${stop ? ' stop' : ''}">
    <div class="dialog-b"><h4>${esc(title)}</h4>
      ${bodyHtml}</div>
    <div class="sheetc-f">${footHtml}</div></div></div>`;
}

const app = document.getElementById('app');

let lastView = null, lastOverlay = null;
function render(){
  const s = SCREENS[S.screen]();
  const view = [S.screen, S.tab, S.jobId, S.motor, S.sched, S.mine,
                S.mrec, S.urec, S.track.jobId, S.guide.corpus, S.guide.ix].join('|');
  const sameOverlay = S.overlay === lastOverlay && S.overlay !== null;
  const keep = view === lastView ? scrollOf('.app-scroll') : 0;
  const keepSheet = sameOverlay ? scrollOf('.ovl>*') : 0;

  app.innerHTML =
    s.bar + connbar() + (s.gate || '') +
    `<div class="app-scroll">${s.body}</div>` +
    (s.foot || (s.tabs ? tabbar(s.tabs) : '')) +
    overlay() +
    (S.toast ? `<div class="toastwrap">${S.toast}</div>` : '');

  if (keep)      setScroll('.app-scroll', keep);
  if (keepSheet) setScroll('.ovl>*', keepSheet);
  if (S.guide.stick){ const el = app.querySelector('.app-scroll');
    if (el) el.scrollTop = el.scrollHeight; S.guide.stick = false; }
  if (sameOverlay) app.querySelectorAll('.ovl, .ovl>*')
    .forEach(el => { el.style.animation = 'none'; });
  lastView = view; lastOverlay = S.overlay;
  renderRail();
}

const scrollOf = sel => { const el = app.querySelector(sel); return el ? el.scrollTop : 0; };
const setScroll = (sel, v) => { const el = app.querySelector(sel); if (el) el.scrollTop = v; };

function renderRail(){
  const set = RAIL[S.lang] || RAIL.ar;
  const onJob = S.screen === 'job';
  const j = onJob && S.jobId ? DB[S.jobId] : null;
  const P = j ? perms(j) : null;
  const pend = !!j && j.status === 'PENDING';
  const why  = pend ? 'rl_untilacc'
             : (j && j.status === 'CLOSED')    ? 'rl_isclosed'
             : (j && j.status === 'CANCELLED') ? 'rl_iscancelled' : 'rl_notyours';
  const key = !onJob ? S.screen
    : pend                        ? 'jobPending'
    : j && j.status === 'CLOSED'    ? 'jobClosed'
    : j && j.status === 'CANCELLED' ? 'jobCancelled'
    :                                 'job';
  const r = set[key] || set.wave;
  document.getElementById('rail').innerHTML = `
    <h2>${esc(r[0])}</h2>
    <div class="tech" style="color:var(--ink3);font-size:var(--fs-micro)">${esc(r[1])}</div>
    ${r[2].length ? `<h3>${esc(t('rl_what'))}</h3><ul>${
      r[2].map(x => `<li>${isoRefs(x)}</li>`).join('')}</ul>` : ''}
    <h3>${esc(t('rl_state'))}</h3>
    <ul>
      <li>${esc(t('rl_role'))}: <b>${esc(roleLabel())} — ${esc(me().name)}</b></li>
      <li>${esc(t('rl_net'))}: <b>${esc(t('c_net_' + S.net))}</b></li>
      <li>${esc(t('rl_queue'))}: <code>${S.queue.length}</code></li>
      ${P ? `<li>${esc(t('rl_edit'))}: <b>${esc(P.edit ? t('rl_allowed') : t('rl_denied'))}</b>
        ${P.edit ? '' : esc(t(why))}</li>` : ''}
      ${S.screen === 'login' ? `<li>${esc(t('rl_pin'))}: <code>123456</code></li>` : ''}
    </ul>
    <h3>${esc(t('rl_rules'))}</h3>
    <ul>
      <li>${esc(t('rl_r1'))}</li>
      <li>${esc(t('rl_r2'))}</li>
      <li>${esc(t('rl_r3'))} <code>.tech</code></li>
      <li>${esc(t('rl_r4'))}</li>
    </ul>`;
}

function go(screen){
  const fam = FAM[screen];
  S.screen = screen; S.overlay = null;
  if (fam && fam !== S.fam){ S.fam = fam; clearFilt(); }
  render();
}
function toast(html, cls = 'ok'){
  S.toast = `<div class="toast ${cls}">${ic(cls === 'ok' ? 'check' : 'alert',20)}<span>${html}</span></div>`;
  render();
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { S.toast = null; render(); }, 3200);
}

app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-act][role="button"]');
  if (!el) return;
  e.preventDefault();
  el.click();
});

let actbarLockAt = 0;
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.closest('.actbar')){
    const now = performance.now();
    if (now - actbarLockAt < 400) return;
    actbarLockAt = now;
  }
  const [act, arg] = el.dataset.act.split(':');
  const j = job();

  switch (act){
    case 'noop': return;
    case 'close': S.overlay = null; return render();
    case 'back':  if (S.screen === 'mdata' && S.mdraft){ S.mrec = null; S.mdraft = null; return render(); }
                  if (S.screen === 'users' && S.udraft){ S.urec = null; S.udraft = null; return render(); }
                  if (S.screen === 'mdata' || S.screen === 'users' || S.screen === 'config')
                    return go('admin');
                  if (S.screen === 'edit'){ S.draft = null; return go('job'); }
                  if (S.screen === 'motor') return go(S.mfrom || 'motors');
                  if (S.screen === 'trackjob'){ const from = S.track.from;
                    S.track.jobId = null; S.track.from = null; return go(from || 'track'); }
                  if (S.screen === 'guideix' && S.guide.ix){ S.guide.ix = null; return render(); }
                  if (S.screen === 'guideix') return go('guide');
                  if (S.screen === 'guide' && S.guide.corpus){
                    S.guide.corpus = null; S.guide.thread = [];
                    S.guide.turn = 0; S.guide.gapUsed = false;
                    return render();
                  }
                  return go(S.from || (S.jobId && DB[S.jobId]
                            && DB[S.jobId].status === 'PENDING' ? 'pending' : 'active'));

    case 'tab':
      if (arg === 'jobs')   return go(SCREENS[S.tab] ? S.tab : 'pending');
      if (arg === 'sched')  return go('sched');
      if (arg === 'motors') return go('motors');
      return go('module');

    case 'seg':
      S.tab = arg;
      return go(arg);
    case 'sch': S.sched = arg; return render();

    case 'closed':    return go('closed');
    case 'cancelled': return go('cancelled');
    case 'sched':     return go('sched');
    case 'motors':    return go('motors');

    case 'motor':
      S.motor = arg;
      if (S.screen === 'sched' || S.screen === 'motors') S.mfrom = S.screen;
      return go('motor');

    case 'mkreq': {
      S.form.area = areaOf(arg);
      S.form.motors = [arg];
      S.form.deAmt  = md(arg).dDE;
      S.form.ndeAmt = md(arg).dNDE;
      S.from = S.screen;
      go('new');
      return toast(t('ts_prefill', T(arg)));
    }

    case 'sync':    return go('sync');
    case 'filters': S.overlay = 'filters'; return render();

    case 'open':
      S.jobId = arg;
      S.from = S.screen === 'job' ? S.from : S.screen;
      return go('job');

    /* ---- Accept Job ---- */
    case 'accept': {
      const tj = DB[arg];
      S.jobId = arg;
      tj.status = 'ACCEPTED';
      tj.accBy  = USERS.tech.name;
      tj.accAt  = S.clock;
      tj.ageH   = 0;
      tj.updH   = 0;
      if (S.net === 'online'){
        if (tj.sensor){
          if (tj.de.before  === null) tj.de.before  = tj.de.live;
          if (tj.nde.before === null) tj.nde.before = tj.nde.live;
        }
        S.tab = 'active';
        go('job');
        return toast(esc(t('ts_accepted')));
      }
      tj.sync = 'queued';
      enqueue('accept', tj.id);
      S.tab = 'active';
      S.screen = 'job';
      S.overlay = 'prov';
      return render();
    }

    /* ---- shots stepper ---- */
    case 'inc': j[arg].app = Math.min(CFG.appMax, j[arg].app + CFG.step); return render();
    case 'dec': j[arg].app = Math.max(CFG.appMin, j[arg].app - CFG.step); return render();
    case 'type': {
      const v = prompt(t('pr_applied', arg.toUpperCase(), appR()), j[arg].app);
      if (v === null) return;
      const n = parseInt(v, 10);
      if (isNaN(n) || n < CFG.appMin || n > CFG.appMax)
        return toast(esc(t('ts_range0', appR())),'err');
      j[arg].app = n;
      return render();
    }

    case 'wnote': {
      const v = prompt(t('pr_wnote'), tx(j.wNote));
      if (v === null) return;
      j.wNote = v;
      return render();
    }
    case 'photo': j.photos++; return toast(esc(t('ts_photo')));

    /* ---- Update ---- */
    case 'update': {
      const p = progress(j);
      if (p.app > 0 && j.status === 'ACCEPTED') j.status = 'IN_PROGRESS';
      j.updH = 0;
      if (S.net === 'online'){
        j.sync = 'synced';
        return toast(t('ts_saved',
          T('DE ' + j.de.app + (j.nde.sel ? ' · NDE ' + j.nde.app : ''))));
      }
      j.sync = 'queued';
      if (!S.queue.some(q => q.jobId === j.id && q.kind === 'update'))
        enqueue('update', j.id);
      return toast(esc(t('ts_saved_off')));
    }

    /* ---- Finish Job gates ---- */
    case 'finish': {
      const g = finishGate(j);
      if (g === 'ptw')      { S.overlay = 'g-ptw';      return render(); }
      if (g === 'accepted') { S.overlay = 'g-accepted'; return render(); }
      if (g === 'over')     { S.overlay = 'g-over';     return render(); }
      if (g === 'under')    { S.overlay = 'g-under';    return render(); }
      S.overlay = null;
      return doFinish();
    }
    case 'reason': {
      const v = prompt(t('pr_reason'), S.finishReason);
      if (v === null) return;
      S.finishReason = v; return render();
    }
    case 'do-finish': {
      if (S.overlay === 'g-over'){
        if (!S.finishReason.trim()) return;
        const prev = tx(j.wNote);
        j.wNote = (prev ? prev + ' — ' : '') + t('wnote_over') + S.finishReason.trim();
        S.finishReason = '';
      }
      S.overlay = null;
      return doFinish();
    }

    case 'jmore': S.overlay = 'jmore'; return render();

    /* ---- Release ---- */
    case 'release': if (arg){ S.jobId = arg; S.from = 'stalled'; }
                    S.relReason = null; S.relComment = ''; S.overlay = 'release'; return render();
    case 'rr':      S.relReason = +arg; return render();
    case 'relcom': {
      const v = prompt(t('pr_relcom'), S.relComment);
      if (v === null) return;
      S.relComment = v; return render();
    }
    case 'do-release': {
      const other = S.relReason === OTHER_REASON;
      if (S.relReason === null || (other && !S.relComment.trim())) return;
      const forced = j.accBy !== me().name;
      const entry = { by:me().name, at:S.clock, de:j.de.app, nde:j.nde.app };
      if (forced) entry.from = j.accBy;
      j.relHist.push(other
        ? Object.assign(entry, { reason:S.relComment.trim() })
        : Object.assign(entry, { ri:S.relReason }));
      j.status = 'PENDING';
      j.accBy  = null;
      j.accAt  = null;
      j.released = true;
      if (S.net !== 'online'){ j.sync = 'queued'; enqueue('release', j.id); }
      S.overlay = null;
      if (S.from === 'stalled'){ go('stalled'); return toast(esc(t('ts_released'))); }
      S.tab = 'pending';
      go('pending');
      return toast(esc(t('ts_released')));
    }

    /* ---- Reassign ---- */
    case 'reassign': {
      if (arg){ S.jobId = arg; S.from = 'stalled'; }
      const cands = techsIn(job().area);
      if (!cands.includes(S.newTech)) S.newTech = cands[0] || null;
      S.reassignReason = ''; S.overlay = 'reassign'; return render();
    }
    case 'nexttech': {
      const cands = techsIn(j.area);
      if (!cands.length) return;
      const i = cands.indexOf(S.newTech);
      S.newTech = cands[(i + 1) % cands.length];
      return render();
    }
    case 'racom': {
      const v = prompt(t('pr_racom'), S.reassignReason);
      if (v === null) return;
      S.reassignReason = v; return render();
    }
    case 'do-reassign': {
      if (!S.reassignReason.trim() || !S.newTech) return;
      j.accBy = S.newTech;
      if (S.net !== 'online'){ j.sync = 'queued'; enqueue('reassign', j.id); }
      S.overlay = null; render();
      return toast(t('ts_reassigned', T(S.newTech), T(j.status)));
    }

    case 'cancel': if (arg){ S.jobId = arg; S.from = 'stalled'; }
                   S.cnReason = null; S.cnComment = ''; S.overlay = 'cancel'; return render();

    /* ---- New Job Request ---- */
    case 'new': return go('new');
    case 'tgl': S.form[arg] = !S.form[arg]; return render();
    case 'finc': S.form[arg + 'Amt'] = Math.min(CFG.reqMax, S.form[arg + 'Amt'] + CFG.step); return render();
    case 'fdec': S.form[arg + 'Amt'] = Math.max(CFG.reqMin, S.form[arg + 'Amt'] - CFG.step); return render();
    case 'ftype': {
      const v = prompt(t('pr_famt', arg.toUpperCase(), reqR()), S.form[arg + 'Amt']);
      if (v === null) return;
      const n = parseInt(v, 10);
      if (isNaN(n) || n < CFG.reqMin || n > CFG.reqMax)
        return toast(esc(t('ts_range1', reqR())),'err');
      S.form[arg + 'Amt'] = n; return render();
    }
    case 'rmmotor': S.form.motors.splice(+arg, 1); return render();
    case 'submit': {
      if (newProblems(S.form).length){
        const first = app.querySelector('.field-c.err, .field-h.e, .blocked-why');
        if (first) first.scrollIntoView({ block:'center' });
        return;
      }
      const clash = S.form.motors.map(openOn).find(Boolean);
      if (clash){ S.dup = clash; S.overlay = 'dup'; return render(); }
      return createJobs();
    }


    case 'empid': {
      const v = prompt(t('pr_empid'), me().id);
      if (v === null) return;
      const hit = Object.keys(USERS).find(k => USERS[k].id === v.trim());
      if (!hit){ S.signErr = 'id'; return render(); }
      S.role = hit; S.signErr = null;
      paintRole();
      return render();
    }
    case 'pin': {
      const v = prompt(t('pr_pin'), S.pin);
      if (v === null) return;
      S.pin = v.replace(/\D/g,'').slice(0,12);
      S.signErr = null;
      return render();
    }
    case 'pinshow': S.pinShown = !S.pinShown; return render();
    case 'signin': {
      if (S.locked || S.pin.length < 6) return;
      if (S.pin === '000000'){
        S.attempts++;
        S.signErr = 'pin';
        if (S.attempts >= 5) S.locked = true;
        return render();
      }
      S.attempts = 0; S.signErr = null; S.pin = ''; S.pinShown = false;
      go('home');
      return toast(t('ts_signed', T(me().name)));
    }
    case 'signout':
      S.overlay = null; S.pin = ''; S.pinShown = false;
      S.attempts = 0; S.locked = false; S.signErr = null;
      return go('login');

    /* ---- Home ---- */
    case 'home':    return go('home');
    case 'module':  return go('module');
    case 'track':   return go('track');
    case 'guide':   return go('guide');
    case 'profile': S.overlay = 'profile'; return render();
    case 'swaplang': applyLang(S.lang === 'ar' ? 'en' : 'ar'); return;

    /* ---- My Jobs ---- */
    case 'mine':
      if (arg){ S.mine = arg; return render(); }
      S.mine = 'active';
      return go('mine');

    case 'editjob': {
      S.draft = { area:j.area, motor:j.motor, ptw:j.ptw,
                  de:j.de.sel,   deAmt: j.de.sel  ? j.de.req  : 50,
                  nde:j.nde.sel, ndeAmt:j.nde.sel ? j.nde.req : 40,
                  note:j.reqNote };
      S.overlay = null;
      return go('edit');
    }
    case 'dpka': {
      if (arg !== S.draft.area){ S.draft.area = arg; S.draft.motor = ''; }
      S.overlay = 'dpkmotor';
      return render();
    }
    case 'dpkm': S.draft.motor = arg; S.overlay = null; return render();
    case 'dptw': {
      const v = prompt(t('pr_ptw'), S.draft.ptw);
      if (v === null) return;
      S.draft.ptw = v.trim(); return render();
    }
    case 'dtgl': S.draft[arg] = !S.draft[arg]; return render();
    case 'dinc': S.draft[arg + 'Amt'] = Math.min(CFG.reqMax, S.draft[arg + 'Amt'] + CFG.step); return render();
    case 'ddec': S.draft[arg + 'Amt'] = Math.max(CFG.reqMin, S.draft[arg + 'Amt'] - CFG.step); return render();
    case 'dtype': {
      const v = prompt(t('pr_famt', arg.toUpperCase(), reqR()), S.draft[arg + 'Amt']);
      if (v === null) return;
      const n = parseInt(v, 10);
      if (isNaN(n) || n < CFG.reqMin || n > CFG.reqMax)
        return toast(esc(t('ts_range1', reqR())),'err');
      S.draft[arg + 'Amt'] = n; return render();
    }
    case 'dnote': {
      const v = prompt(t('n_note'), tx(S.draft.note));
      if (v === null) return;
      S.draft.note = v;
      return render();
    }
    case 'dsave': {
      const d = S.draft;
      if (!d.motor) return;
      if (!d.de && !d.nde) return;
      if (d.de  && (d.deAmt  < 1 || d.deAmt  > 500)) return;
      if (d.nde && (d.ndeAmt < 1 || d.ndeAmt > 500)) return;
      const st = ptwState(d.ptw);
      j.area = d.area; j.motor = d.motor; j.kks = kks(d.motor); j.ptw = d.ptw;
      j.ptwTo = st.to || j.ptwTo; j.ptwExpired = !!st.expired;
      j.de.sel  = d.de;  if (d.de)  j.de.req  = d.deAmt;
      j.nde.sel = d.nde; if (d.nde) j.nde.req = d.ndeAmt;
      j.reqNote = d.note;
      if (S.role === 'sup') j.editHist.push({ by:me().name, rk:S.role, at:S.clock });
      if (S.net !== 'online'){ j.sync = 'queued'; enqueue('update', j.id); }
      S.draft = null;
      go('job');
      return toast(esc(t('ts_edited')));
    }

    /* ---- Cancel Request ---- */
    case 'cnr':    S.cnReason = +arg; return render();
    case 'cncom': {
      const v = prompt(t('cn_comment_l'), S.cnComment);
      if (v === null) return;
      S.cnComment = v; return render();
    }
    case 'do-cancel': {
      const other = S.cnReason === CN_OTHER;
      if (S.cnReason === null || (other && !S.cnComment.trim())) return;
      const entry = { by:me().name, at:S.clock, st:j.status };
      j.cancelled = other ? Object.assign(entry, { reason:S.cnComment.trim() })
                          : Object.assign(entry, { ri:S.cnReason });
      j.status = 'CANCELLED';
      if (S.net !== 'online'){ j.sync = 'queued'; enqueue('cancel', j.id); }
      S.overlay = null; S.cnReason = null; S.cnComment = '';
      go(S.from || 'pending');
      return toast(esc(t('ts_cancelled')));
    }

    /* ---- search and filters ---- */
    case 'search': {
      if (S.q){ S.q = ''; return render(); }
      const v = prompt(t('p_search'), S.q);
      if (v === null) return;
      S.q = v; return render();
    }
    case 'farea': {
      const a = S.filt.areas, i = a.indexOf(arg);
      i < 0 ? a.push(arg) : a.splice(i, 1);
      return render();
    }
    case 'fby': {
      const people = peopleIn(filtBase(), filtKind());
      const i = people.indexOf(S.filt.by);
      S.filt.by = (i + 1 >= people.length) ? null : people[i + 1];
      return render();
    }
    case 'fdate':    S.filt.date = arg; return render();
    case 'frel':     S.filt.rel = !S.filt.rel; return render();
    case 'fstalled': S.filt.stalled = !S.filt.stalled; return render();
    case 'fclear':   clearFilt(); S.overlay = null; return render();
    /* ---- filter setters ---- */
    case 'fover':    S.filt.over = !S.filt.over; return render();
    case 'fnojob':   S.filt.noJob = !S.filt.noJob; return render();
    case 'fcnr':     S.filt.cnr = S.filt.cnr === +arg ? null : +arg; return render();
    case 'fmstate':  S.filt.mstate = S.filt.mstate === arg ? null : arg; return render();
    case 'fmon': {
      const v = arg === 'on';
      S.filt.mon = S.filt.mon === v ? null : v;
      return render();
    }
    case 'freq': {
      const people = reqIn(filtBase());
      const i = people.indexOf(S.filt.req);
      S.filt.req = (i + 1 >= people.length) ? null : people[i + 1];
      return render();
    }
    case 'fx': {
      const [what, val] = arg.split('~');
      if (what === 'q')       S.q = '';
      if (what === 'area')    S.filt.areas = S.filt.areas.filter(a => a !== val);
      if (what === 'by')      S.filt.by = null;
      if (what === 'req')     S.filt.req = null;
      if (what === 'date')    S.filt.date = defDate();
      if (what === 'rel')     S.filt.rel = false;
      if (what === 'stalled') S.filt.stalled = false;
      if (what === 'over')    S.filt.over = false;
      if (what === 'cnr')     S.filt.cnr = null;
      if (what === 'mstate')  S.filt.mstate = null;
      if (what === 'mon')     S.filt.mon = null;
      if (what === 'nojob')   S.filt.noJob = false;
      return render();
    }

    /* ---- the rest of the request form ---- */
    case 'pkarea': case 'pkmotor': case 'dpkarea': case 'dpkmotor':
      S.overlay = act; return render();
    case 'pka': {
      if (arg !== S.form.area){ S.form.area = arg; S.form.motors = []; }
      S.overlay = 'pkmotor';
      return render();
    }
    case 'pkm': {
      const i = S.form.motors.indexOf(arg);
      if (i < 0) S.form.motors.push(arg); else S.form.motors.splice(i, 1);
      return render();
    }
    case 'fptw': {
      const v = prompt(t('pr_ptw'), S.form.ptw);
      if (v === null) return;
      S.form.ptw = v.trim(); return render();
    }
    case 'do-create': S.dup = null; S.overlay = null; return createJobs();

    case 'admin':  return go('admin');
    case 'stalled': return go('stalled');
    case 'mdata':  S.mrec = null; S.mdraft = null; return go('mdata');
    case 'mdedit': {
      const d = md(arg);
      go('mdata');
      S.mrec = arg;
      S.mdraft = { key:arg, isNew:false, name:arg, kks:kks(arg), area:areaOf(arg),
        grease:greaseOf(arg), iv:d.iv, dDE:d.dDE, dNDE:d.dNDE,
        sensor:d.sensor !== false, act:d.act !== false, tags:Object.assign({}, d.tags) };
      return render();
    }
    case 'users':  S.urec = null; S.udraft = null; return go('users');
    case 'config': S.cdraft = Object.assign({}, CFG); return go('config');

    /* ---- motor master data ---- */
    case 'mmrec': {
      const d = md(arg);
      S.mrec = arg;
      S.mdraft = { key:arg, isNew:false, name:arg, kks:kks(arg), area:areaOf(arg),
        grease:greaseOf(arg), iv:d.iv, dDE:d.dDE, dNDE:d.dNDE,
        sensor:d.sensor !== false, act:d.act !== false, tags:Object.assign({}, d.tags) };
      return render();
    }
    case 'mmnew':
      S.mrec = '';
      S.mdraft = { key:null, isNew:true, name:'', kks:'', area:AREAS[0], grease:GREASES[0],
        iv:3500, dDE:50, dNDE:40, sensor:true, act:true,
        tags:{ rh:'', de:'', nde:'', st:'' } };
      return render();
    case 'mmname': {
      const v = prompt(t('mm_name'), S.mdraft.name);
      if (v === null) return;
      S.mdraft.name = v.trim(); return render();
    }
    case 'mmkks': {
      const v = prompt(t('mm_kks'), S.mdraft.kks);
      if (v === null) return;
      S.mdraft.kks = v.trim().toUpperCase(); return render();
    }
    case 'mmiv': {
      const v = prompt(t('cf_pr', t('mm_iv'), t('md_hours')), S.mdraft.iv);
      if (v === null) return;
      const n = parseInt(v, 10);
      if (isNaN(n) || n <= 0) return toast(esc(t('mm_iv_bad')),'err');
      S.mdraft.iv = n; return render();
    }
    case 'mmamt': {
      const v = prompt(t('cf_pr', t(arg === 'dDE' ? 'mm_de' : 'mm_nde'), reqR()), S.mdraft[arg]);
      if (v === null) return;
      const n = parseInt(v, 10);
      if (isNaN(n) || outReq(n)) return toast(esc(t('ts_range1', reqR())),'err');
      S.mdraft[arg] = n; return render();
    }
    case 'mmsensor': S.mdraft.sensor = !S.mdraft.sensor; return render();
    case 'mmtag': {
      const v = prompt(t('mm_tags'), S.mdraft.tags[arg]);
      if (v === null) return;
      S.mdraft.tags[arg] = v.trim(); return render();
    }
    case 'mmsave': {
      const d = S.mdraft;
      if (mmBad(d).length || kksTaken(d)) return;
      const name = d.name.trim();
      if (d.isNew){
        MOTORDATA[name] = { rh:0, iv:d.iv, next:d.iv, on:false, rate:20,
          sensor:d.sensor, de:null, nde:null, dDE:d.dDE, dNDE:d.dNDE, act:true,
          tags:Object.assign({}, d.tags) };
        MOTORS[d.area].push(name);
      } else {
        if (name !== d.key) renameMotor(d.key, name);
        const from = areaOf(name);
        if (from !== d.area){
          const arr = MOTORS[from], i = arr.indexOf(name);
          if (i >= 0) arr.splice(i, 1);
          MOTORS[d.area].push(name);
        }
        Object.assign(MOTORDATA[name], { iv:d.iv, dDE:d.dDE, dNDE:d.dNDE, sensor:d.sensor });
      }
      KKS[name] = d.kks.trim();
      MGREASE[name] = d.grease;
      MOTORDATA[name].chg = { by:me().name, at:S.clock };
      adLog(d.isNew ? 'mm_create' : 'mm_save', name);
      const made = d.isNew;
      S.mrec = name;
      S.mdraft = null;
      render();
      return toast(t(made ? 'ts_mm_created' : 'ts_mm_saved', T(name)));
    }
    case 'mmdeact':
      if (openOn(S.mdraft.key)) return;
      S.overlay = 'mmdeact'; return render();
    case 'mmreact': S.overlay = 'mmreact'; return render();
    case 'do-mmdeact': {
      const m = S.mdraft.key;
      MOTORDATA[m].act = false;
      MOTORDATA[m].chg = { by:me().name, at:S.clock };
      adLog('mm_deact', m);
      S.mdraft.act = false; S.overlay = null;
      render();
      return toast(t('ts_mm_deact', T(m)));
    }
    case 'do-mmreact': {
      const m = S.mdraft.key;
      MOTORDATA[m].act = true;
      MOTORDATA[m].chg = { by:me().name, at:S.clock };
      adLog('mm_react', m);
      S.mdraft.act = true; S.overlay = null;
      render();
      return toast(t('ts_mm_react', T(m)));
    }

    /* ---- user management ---- */
    case 'umrec': {
      const x = person(arg);
      S.urec = arg;
      S.udraft = { key:arg, isNew:false, id:x.id, name:x.name, rk:x.rk,
                   areas:x.areas.slice(), act:x.act };
      return render();
    }
    case 'umnew':
      S.urec = '';
      S.udraft = { key:null, isNew:true, id:'', name:'', rk:'tech', areas:[], act:true };
      return render();
    case 'umid': {
      const v = prompt(t('um_id'), S.udraft.id);
      if (v === null) return;
      S.udraft.id = v.replace(/\D/g,'').slice(0,5); return render();
    }
    case 'umname': {
      const v = prompt(t('um_name'), S.udraft.name);
      if (v === null) return;
      S.udraft.name = v.trim(); return render();
    }
    case 'umarea': {
      const a = S.udraft.areas, i = a.indexOf(arg);
      i < 0 ? a.push(arg) : a.splice(i, 1);
      return render();
    }
    case 'umsave': {
      const d = S.udraft;
      if (umBad(d).length) return;
      const name = d.name.trim(), id = d.id.trim();
      if (d.isNew){
        PEOPLE.push({ id, name, rk:d.rk, areas:d.areas.slice(), act:true,
                      chg:{ by:me().name, at:S.clock } });
      } else {
        const x = person(d.key);
        if (name !== x.name) renamePerson(x.name, name);
        Object.assign(x, { id, name, rk:d.rk, areas:d.areas.slice(),
                           chg:{ by:me().name, at:S.clock } });
      }
      adLog(d.isNew ? 'um_create' : 'um_save', name);
      const made = d.isNew;
      S.urec = id; S.udraft = null;
      render();
      return toast(t(made ? 'ts_um_created' : 'ts_um_saved', T(name)));
    }
    case 'umpin': S.overlay = 'umpin'; return render();
    case 'do-umpin': {
      const n = S.udraft.name;
      adLog('um_pin', n);
      S.overlay = null; render();
      return toast(t('ts_um_pin', T(n)));
    }
    case 'umdeact': {
      const d = S.udraft;
      if (d.key === me().id || heldBy(d.name)) return;
      S.overlay = 'umdeact'; return render();
    }
    case 'umreact': S.overlay = 'umreact'; return render();
    case 'do-umdeact': {
      const x = person(S.udraft.key);
      x.act = false; x.chg = { by:me().name, at:S.clock };
      adLog('um_deact', x.name);
      S.udraft.act = false; S.overlay = null;
      render();
      return toast(t('ts_um_deact', T(x.name)));
    }
    case 'do-umreact': {
      const x = person(S.udraft.key);
      x.act = true; x.chg = { by:me().name, at:S.clock };
      adLog('um_react', x.name);
      S.udraft.act = true; S.overlay = null;
      render();
      return toast(t('ts_um_react', T(x.name)));
    }

    /* ---- system configuration ---- */
    case 'cfset': {
      const row = CFROWS.find(r => r[1] === arg);
      const [, key, label, kind, unit] = row;
      if (kind === 'range'){
        const v = prompt(t('cf_pr_r', t(label)), cfVal(S.cdraft, key, kind));
        if (v === null) return;
        const m = v.split(/[-–—]/).map(x => parseInt(x, 10));
        if (m.length !== 2 || m.some(isNaN) || m[0] >= m[1])
          return toast(esc(t('cf_range_bad')),'err');
        S.cdraft[key + 'Min'] = m[0]; S.cdraft[key + 'Max'] = m[1];
        return render();
      }
      if (kind === 'text'){
        const v = prompt(t(label), S.cdraft[key]);
        if (v === null) return;
        if (!v.includes('#')) return toast(esc(t('cf_ptwmask_bad')),'err');
        S.cdraft[key] = v.trim(); return render();
      }
      const v = prompt(t('cf_pr', t(label), t(unit)), S.cdraft[key]);
      if (v === null) return;
      const n = parseFloat(v);
      if (isNaN(n) || n <= 0) return toast(esc(t('cf_bad')),'err');
      S.cdraft[key] = n; return render();
    }
    case 'cfreset': S.cdraft = Object.assign({}, CFG); return render();
    case 'cfsave': {
      const n = cfChanged();
      if (!n) return;
      Object.assign(CFG, S.cdraft);
      adLog('cf_title', t('cf_save', n));
      S.cdraft = Object.assign({}, CFG);
      render();
      return toast(t('ts_cf_saved', n));
    }

    /* ---- the shared one-of-a-list sheet ---- */
    case 'pick': {
      S.pick =
          arg === 'mmarea'   ? { title:'pk1_area', mono:true, cur:S.mdraft.area,
              items:AREAS.map(a => [a, a, t('n_pk_area_n', motorsIn(a).length)]),
              set:v => { S.mdraft.area = v; } }
        : arg === 'mmgrease' ? { title:'pk1_grease', mono:true, cur:S.mdraft.grease,
              items:GREASES.map(g => [g, g]), hint:'mm_grease_h',
              set:v => { S.mdraft.grease = v; } }
        :                      { title:'pk1_role', cur:S.udraft.rk,
              items:ROLES.map(r => [r, t('role_' + r)]),
              set:v => { S.udraft.rk = v; } };
      S.overlay = 'pick'; return render();
    }
    case 'pk1': S.pick.set(arg); S.pick = null; S.overlay = null; return render();

    /* ---- what this prototype does not build ---- */
    case 'soon': {
      const e = SOON[arg];
      S.soon = e ? { name:e.name(), ref:e.ref, wave:e.wave() }
                 : { name:arg, ref:'—', wave:t('w_later') };
      S.overlay = 'soon';
      return render();
    }

    /* ---- sync queue ---- */
    case 'retry':
      if (S.net === 'online'){
        S.queue = [];
        Object.values(DB).forEach(x => { if (x.sync === 'queued') x.sync = 'synced'; });
        Object.values(TDB).forEach(x => { if (x.sync === 'queued') x.sync = 'synced'; });
        render();
        return toast(esc(t('ts_synced')));
      }
      return toast(esc(t('ts_noconn')),'err');

    case 'topen':
      S.track.jobId = arg; S.track.from = S.screen;
      return go('trackjob');

    case 'taccept': {
      const x = TDB[arg];
      x.status = 'ACCEPTED';
      x.log.push({ k:'acc', by:'—', dept:myDept(), at:trackStamp(), note:null, photos:0 });
      x.updH = 0;
      if (enqueue('taccept', arg)) x.sync = 'queued';
      S.track.jobId = arg;
      go('trackjob');
      return toast(t('ts_acc', esc(dShort(myDept()))));
    }

    case 'tstart': {
      const tj = trackJob();
      tj.status = 'IN_PROGRESS';
      tj.log.push({ k:'start', by:'—', dept:myDept(), at:trackStamp(), note:null, photos:0 });
      tj.updH = 0;
      if (enqueue('tstart', tj.id)) tj.sync = 'queued';
      render();
      return toast(esc(t('ts_start')));
    }

    case 'tupdate':
      S.track.upd = { note:'', photos:0, err:false };
      S.overlay = 'tupdate';
      return render();

    case 'tunote': {
      const v = prompt(t('u_note_l') + ':', S.track.upd.note);
      if (v !== null) S.track.upd.note = v;
      return render();
    }
    case 'tuphoto':
      if (S.track.upd.photos < CFG.photoMax) S.track.upd.photos++;
      return render();

    case 'tdo-update': {
      const tj = trackJob();
      if (!S.track.upd.note.trim()){ S.track.upd.err = true; return render(); }
      tj.status = 'IN_PROGRESS';
      tj.log.push({ k:'upd', by:'—', dept:myDept(), at:trackStamp(),
                    note:S.track.upd.note.trim(), photos:S.track.upd.photos });
      tj.updH = 0;
      const off = enqueue('tupdate', tj.id);
      if (off) tj.sync = 'queued';
      S.overlay = null; S.track.upd = { note:'', photos:0, err:false };
      render();
      return toast(esc(t(off ? 'ts_updq' : 'ts_upd')));
    }

    case 'ttest': {
      const tj = trackJob();
      tj.log.push({ k:'test', by:'—', dept:myDept(), at:trackStamp(), note:null, photos:0 });
      tj.updH = 0;
      if (enqueue('ttest', tj.id)) tj.sync = 'queued';
      render();
      return toast(esc(t('ts_test')));
    }

    case 'tfinish': S.overlay = 'tfinish'; return render();
    case 'tdo-finish': {
      const tj = trackJob();
      tj.status = 'CLOSED';
      tj.finAt = trackStamp();
      tj.log.push({ k:'done', by:'—', dept:myDept(), at:trackStamp(), note:null, photos:0 });
      tj.updH = 0;
      if (enqueue('tfinish', tj.id)) tj.sync = 'queued';
      S.overlay = null;
      render();
      return toast(esc(t('ts_fin')));
    }

    case 'tjoin': S.overlay = 'tjoin'; return render();
    case 'tdo-join': {
      const tj = trackJob();
      if (!tj.joined.includes(myDept())) tj.joined.push(myDept());
      tj.log.push({ k:'join', by:'—', dept:myDept(), at:trackStamp(), note:null, photos:0 });
      S.overlay = null;
      render();
      return toast(t('ts_join', esc(dShort(myDept()))));
    }

    case 'gpick':
      S.guide.corpus = arg; S.guide.thread = [];
      S.guide.turn = 0; S.guide.gapUsed = false;
      return render();

    case 'gnewchat': S.overlay = 'gnewchat'; return render();
    case 'gdo-new':
      S.guide.corpus = null; S.guide.thread = [];
      S.guide.turn = 0; S.guide.gapUsed = false;
      S.overlay = null;
      return render();

    case 'gq': {
      const step = SCRIPT[Number(arg)];
      S.guide.turn = Number(arg) + 1;
      return guideSend(step.full, step.a);
    }
    case 'ggap':
      S.guide.gapUsed = true;
      return guideSend(GAP.full, GAP.a);

    case 'gtype': {
      const v = prompt(t('th_ph'), '');
      if (v === null || !v.trim()) return;
      if (S.guide.corpus === 'Unit 1' && S.guide.turn < SCRIPT.length){
        const step = SCRIPT[S.guide.turn]; S.guide.turn++;
        return guideSend(v.trim(), step.a);
      }
      return guideSend(v.trim(), OTHER.a);
    }

    case 'gsrc': S.guide.src = arg; S.overlay = 'gsrc'; return render();
    case 'gcopy': return toast(esc(t('ts_copy')));
    case 'ggoix':
      S.guide.ix = S.guide.corpus && TRACK_AREAS.includes(S.guide.corpus) ? S.guide.corpus : null;
      return go('guideix');

    case 'gixarea': S.guide.ix = arg; return render();

    case 'gupload': {
      const a = S.guide.ix, n = DOCS.length;
      DOCS.push({ id:'u' + (n + 1), area:a, code:'MNT-PR-021', kind:'proc', rev:'Rev 1',
        n:{ ar:'إجراء استبدال محامل المضخّات الأفقيّة',
            en:'Bearing replacement procedure — horizontal pumps' },
        pages:31, pass:0, st:'queued', at:'—', by:me().name });
      DOCS.push({ id:'u' + (n + 2), area:a, code:'VIB-2026-08', kind:'rep', rev:'2026-08',
        n:{ ar:'تقرير تحليل الاهتزاز — آب 2026', en:'Vibration analysis report — August 2026' },
        pages:42, pass:0, st:'queued', at:'—', by:me().name });
      render();
      return toast(esc(t('ts_up', 2)));
    }

    case 'grunix': {
      queueIn(S.guide.ix).forEach(d => { d.st = 'ix'; d.pct = 0; });
      startIx();
      return render();
    }

    case 'gdel': S.guide.del = arg; S.overlay = 'gdel'; return render();
    case 'gdo-del':
      DOCS = DOCS.filter(d => d.id !== S.guide.del);
      S.guide.del = null; S.overlay = null;
      render();
      return toast(esc(t('ts_del')));
  }
});

function createJobs(){
  const f = S.form, st = ptwState(f.ptw);
  S.created = [];
  f.motors.forEach((m, i) => {
    const id = S.net === 'online' ? 'MG-2026-04' + (20 + i) : t('n_tempid', i + 1);
    DB[id] = {
      id, motor:m, kks:kks(m), area:f.area,
      grease:'Lithium Complex EP2', ptw:f.ptw, ptwTo:st.to || '2026-08-11 18:00',
      ptwExpired:false,
      reqBy:me().name, accBy:null, status:'PENDING',
      reqAt:'08-10 · ' + S.clock, accAt:null, ageH:0,
      de:{ sel:f.de,  req:f.de  ? f.deAmt  : 0, app:0, before:null, live:62.0 },
      nde:{sel:f.nde, req:f.nde ? f.ndeAmt : 0, app:0, before:null, live:56.0 },
      sensor:md(m).sensor !== false, released:false, relHist:[], editHist:[],
      reqNote:'', wNote:'', photos:0, updH:0,
      sync: S.net === 'online' ? 'synced' : 'queued'
    };
    S.created.push(id);
    if (S.net !== 'online') enqueue('create', id);
  });
  return go('newok');
}

function doFinish(){
  const j = job();
  j.status = 'CLOSED';
  j.finAt  = '08-10 · ' + S.clock;
  sides(j).forEach(k => {
    const b = j[k];
    if (!j.sensor){ b.fin = null; b.aft = null; b.max = null; return; }
    b.fin = b.live;
    b.aft = null;
    b.max = Math.max(b.before === null ? -Infinity : b.before,
                     b.live   === null ? -Infinity : b.live);
    if (!isFinite(b.max)) b.max = null;
  });
  if (S.net !== 'online'){
    j.sync = 'queued';
    enqueue('finish', j.id);
  } else {
    j.sync = 'synced';
  }
  S.from = 'closed';
  go('job');
  return toast(esc(t('cl_toast')));
}

function bindToggle(id, attr, fn){
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...b.parentElement.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    fn(b.dataset[attr]);
  });
}
function paintChrome(){
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]')
    .forEach(el => { el.textContent = t(el.dataset.i18n); });
  paintDepts();
}

function paintDepts(){
  const sel = document.getElementById('tg-dept');
  sel.innerHTML = DEPTS.map(d =>
    `<option value="${d.k}"${d.k === S.dept ? ' selected' : ''}>${
      esc(dName(d.k))}${d.exe ? ' ·' : ''}</option>`).join('');
}

function paintRole(){
  document.querySelectorAll('#tg-role button')
    .forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === S.role)));
}

function applyLang(v){
  S.lang = v;
  const dir = v === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('lang', v);
  document.documentElement.setAttribute('dir', dir);
  document.querySelectorAll('#tg-dir button')
    .forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === dir)));
  paintChrome();
  render();
}

bindToggle('tg-lang','lang', applyLang);
bindToggle('tg-role','role', v => { S.role = v; render(); });
document.getElementById('tg-dept').addEventListener('change', e => {
  S.dept = e.target.value;
  render();
});
bindToggle('tg-net','net',  v => {
  S.net = v;
  if (v === 'online' && S.queue.length){
    S.queue = [];
    Object.values(DB).forEach(x => { if (x.sync === 'queued') x.sync = 'synced'; });
    render();
    return toast(esc(t('ts_back_online')));
  }
  render();
});
bindToggle('tg-theme','theme', v => document.documentElement.setAttribute('data-theme', v));
bindToggle('tg-dir','dir',     v => document.documentElement.setAttribute('dir', v));
bindToggle('tg-size','size',   v => {
  S.size = v;
  document.getElementById('stage').classList.toggle('full', v === 'full');
});

paintChrome();
render();
</script>
</body>
</html>
